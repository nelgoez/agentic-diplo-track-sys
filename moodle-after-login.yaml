                  - generic [ref=e2323]:
                    - paragraph [ref=e2324]: "A lo largo de esta capacitación gratuita, vas a acompañar el proceso de relanzamiento de Ay! Juana, una marca real que busca volver al mercado con una propuesta renovada y estratégica. Junto a Manuel Bomheker, un asesor especializado en branding, vas a conocer de cerca cada paso del proceso: desde los primeros diagnósticos hasta la definición final de una estrategia de comunicación sólida y con proyección."
                    - paragraph [ref=e2325]: El curso está organizado en cinco módulos que combinan videos, materiales prácticos, recursos complementarios y consignas pensadas para que trabajes directamente sobre tu propio proyecto. A medida que avances, vas a poder aplicar herramientas concretas para diseñar tu propio modelo de negocios y construir una marca coherente, con sentido y alineada a tus objetivos personales o profesionales.
                    - paragraph [ref=e2326]: "Esta propuesta no se enfoca exclusivamente en el uso de redes sociales. El objetivo es que desarrolles una mirada integral de tu marca: entendida como un sistema estratégico, capaz de crecer, adaptarse y diferenciarse en el tiempo. Al finalizar el curso, vas a contar con una hoja de ruta clara para tomar decisiones con mayor confianza y claridad."
                    - paragraph [ref=e2327]: Te invitamos a sumarte a esta experiencia de aprendizaje pensada para acompañarte en la creación o fortalecimiento de tu marca, junto a una comunidad que comparte tus mismos desafíos.
