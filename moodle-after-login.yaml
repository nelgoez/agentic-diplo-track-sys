                    - paragraph [ref=e612]:
                      - strong [ref=e613]: Curso de Operario Certificado en Limpieza Institucional – Capacitación Virtual
                    - paragraph [ref=e614]: ¡Prepárate para abrir nuevas oportunidades laborales en el sector de limpieza institucional! Este curso virtual está diseñado para brindarte las herramientas necesarias para desempeñarte de manera eficiente en establecimientos educativos, de salud y comunidades aisladas de la provincia de Córdoba, garantizando un trabajo seguro y de calidad.
                    - paragraph [ref=e615]: A lo largo del programa, abordarás conocimientos técnicos específicos de limpieza y aprenderán a trabajar de forma segura, cumpliendo con normas de higiene, seguridad y legislación laboral. Además, adquirirás nociones de atención al cliente, interpretación de recibos de sueldo, gestión de conflictos y prevención de violencia laboral y de género.
                    - paragraph [ref=e616]: El curso combina clases virtuales con autoevaluaciones en cada módulo. Al completar todas las evaluaciones con éxito, los participantes recibirán un certificado que valida su formación y los prepara para insertarse profesionalmente en el sector de limpieza institucional.
                    - paragraph [ref=e617]:
                      - strong [ref=e618]: "Contenidos principales:"
                    - list [ref=e619]:
                      - listitem [ref=e620]:
                        - paragraph [ref=e621]: Manejo de productos químicos y cuidado del medio ambiente.
                      - listitem [ref=e622]:
                        - paragraph [ref=e623]: Técnicas de limpieza de superficies, pisos, baños, cocinas y grandes áreas.
                      - listitem [ref=e624]:
                        - paragraph [ref=e625]: Trabajo en equipo, comunicación asertiva y resolución de conflictos.
                      - listitem [ref=e626]:
                        - paragraph [ref=e627]: "Primeros auxilios: RCP, desobstrucción de vías respiratorias y tratamiento de quemaduras."
                    - paragraph [ref=e628]: Sumate a esta capacitación y adquiere los conocimientos y competencias que te abrirán las puertas a un empleo formal y seguro en la provincia de Córdoba.
                    - paragraph
