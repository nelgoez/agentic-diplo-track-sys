                - heading "Gestión emocional para vivir mejor - (Verano 2024)" [level=3] [ref=e766]:
                  - link "Gestión emocional para vivir mejor - (Verano 2024)" [ref=e767] [cursor=pointer]:
                    - /url: https://campus.aulavirtual.unc.edu.ar/course/view.php?id=82
                - generic [ref=e771]:
                  - generic [ref=e773]:
                    - paragraph [ref=e774]: El curso propone un recorrido teórico-práctico sobre el mundo de las emociones, con el objetivo de aprender a identificar, entender y gestionar las mismas.
                    - paragraph [ref=e775]
                    - paragraph [ref=e776]: "DOCENTE: Lic. Rodrigo Ezequiel Jaldo"
                    - paragraph [ref=e777]: "TEMARIO:"
                    - paragraph [ref=e778]: "Módulo 1: El mundo de las emociones"
                    - paragraph [ref=e779]: Qué son las emociones. Definición completa del concepto.
                    - paragraph [ref=e780]: Análisis de cada elemento de la definición, con ejemplos cotidianos. Validación emocional. Componentes de las emociones (fisiología, pensamientos, comportamientos y factor social). Diferencia entre emociones y sentimientos. Episodios emocionales. Ejemplos de episodios emocionales (secuencial y en paralelo). Estado del ánimo. Como influyen entre sí las emociones y el estado del ánimo.
                    - paragraph [ref=e781]: "Módulo 2: Aprendiendo a gestionar nuestras emociones"
                    - paragraph [ref=e782]: "Gestión emocional: Definición y análisis de cada elemento del concepto. Consecuencias funcionales y disfuncionales. Gestión intra e interpersonal, con ejemplos cotidianos. Competencias Emocionales. Ingredientes emocionales. Emociones primarias y su significado: tristeza, alegría, enojo, sorpresa, aceptación, asco, anticipación, miedo. Paso a paso para gestionar nuestras emociones."
                    - paragraph [ref=e783]: "Módulo 3: Gestión interna de las emociones"
                    - paragraph [ref=e784]: "Las emociones en nuestro cuerpo. Componente fisiológico de las emociones. Malestar emocional. Neurotransmisores y hormonas que influyen en las emociones. Pautas generales para cualquier emoción. Gestión detallada de la ansiedad (qué es la ansiedad; fisiología de la ansiedad; técnicas de respiración y relajación). Componente cognitivo de las emociones. Sesgos cognitivos: pensamiento dicotómico; catastrofismo; inferencias arbitrarias; filtro negativo; adivinación; personalismos. Los pensamientos son interpretaciones. Interpretaciones alternativas. Reformulación. Reevaluación."
                    - paragraph [ref=e785]: "Módulo 4: Gestión de las conductas emocionales"
                    - paragraph [ref=e786]: Componente comportamental de las emociones. Impulsos emocionales. Conductas de evitación. Gestión de las conductas emocionales. Conductas alternativas. Componente social de las emociones. Mandatos sociales. Culpa. Vergüenza. Autonomía emocional. Límites sanos. Desahogo emocional. Comunicación asertiva. Resolución de conflictos con otras personas.
                    - paragraph [ref=e787]: "DURACIÓN: 20 hs"
                  - generic [ref=e789]: "Duración del curso: 20 Horas"
