                    - paragraph:
                      - strong
                    - paragraph [ref=e1869]: Este recorrido está pensado para acercarte a un oficio con historia y técnica y pasión. A lo largo de tres módulos, vas a conocer cómo se ha desarrollado la peluquería a lo largo del tiempo, cuál es la misión de un peluquero profesional, cuáles son las bases técnicas para comprender la estructura del cráneo y cómo estas se aplican en el proceso de corte.
                    - text: "El objetivo es que te animes a practicar con confianza, desarrollando un lenguaje técnico sólido y una mirada profesional. No necesitás experiencia previa: solo curiosidad, un peine, y ganas de aprender."
