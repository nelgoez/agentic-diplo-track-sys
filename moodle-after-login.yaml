                - generic [ref=e1881]:
                  - generic [ref=e1883]:
                    - paragraph [ref=e1884]: ¿Querés iniciarte en el mundo del tatuaje con una base profesional y responsable? Este curso es la puerta de entrada ideal para quienes buscan transformar su interés artístico en un oficio serio. En solo 12 horas de formación intensiva, vas a descubrir los pilares que separan a un aficionado de un profesional consciente.
                    - paragraph [ref=e1885]: Aprenderás a interpretar el tatuaje como un lenguaje visual, comprendiendo la arquitectura del diseño y cómo este debe adaptarse a la tridimensionalidad del cuerpo humano. Exploraremos la ciencia de la piel para que entiendas dónde debe alojarse el pigmento y cómo funciona el proceso de cicatrización. También te daremos las herramientas para reconocer el equipamiento técnico, comprender los protocolos de bioseguridad necesarios para proteger a tus clientes y establecer un marco ético de trabajo.
                    - paragraph [ref=e1886]: Es el primer paso fundamental para construir tu autoridad en el sector y empezar a trazar tu camino con responsabilidad y excelencia profesionalizar tu pasión.
