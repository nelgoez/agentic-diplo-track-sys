                    - paragraph [ref=e2281]: En este curso aprenderás herramientas claves para planificar y dirigir proyectos de manera efectiva. Conocerás los fundamentos de la gestión de proyectos, el rol de la dirección y la importancia de la triple restricción, optimizando recursos para garantizar el cumplimiento de los objetivos planteados.
