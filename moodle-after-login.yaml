                    - generic [ref=e2163]: "Te damos la bienvenida al curso virtual de Oratoria y presentaciones Públicas Efectivas. A lo largo de esta capacitación gratuita, vas a incorporar herramientas clave para mejorar tu expresión oral y aprender a comunicarte con claridad, seguridad y persuasión en distintos contextos: académicos, laborales o personales."
