                  - paragraph [ref=e2222]:
                    - generic [ref=e2223]:
                      - text: Este curso autogestivo de 20 horas está diseñado para ayudarte a destacarte en procesos de búsqueda laboral y comunicar tu perfil profesional de manera clara, estratégica y actualizada. A lo largo del recorrido vas a adquirir las herramientas necesarias para crear un Curriculum Vitae y una Carta de Presentación efectivos, adaptados a distintos contextos laborales, sectores y plataformas digitales.
                      - text: Aprenderás a poner en valor tu experiencia, tus habilidades y tu potencial, alineando tu perfil con lo que hoy buscan las organizaciones y los equipos de selección. El curso te guía paso a paso para optimizar tus materiales según portales de empleo, entornos virtuales y sistemas de filtrado, incorporando criterios actuales de reclutamiento y lectura rápida.
                      - text: Con actividades prácticas, ejemplos concretos y retroalimentación, podrás revisar, mejorar y profesionalizar tu presentación laboral. Al finalizar, contarás con recursos listos para usar y la seguridad de comunicar quién sos y qué podés aportar, aumentando tus oportunidades de inserción y crecimiento profesional.
