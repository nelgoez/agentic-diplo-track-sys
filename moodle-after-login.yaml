                - generic [ref=e2122]:
                  - 'heading "Captar audiencias y sumar clics: Videos profesionales para redes sociales (re-edición)" [level=3] [ref=e2123]':
                    - 'link "Captar audiencias y sumar clics: Videos profesionales para redes sociales (re-edición)" [ref=e2124] [cursor=pointer]':
                      - /url: https://campus.aulavirtual.unc.edu.ar/course/view.php?id=238
                  - img "Self enrolment" [ref=e2126]: 
                - generic [ref=e2129]:
                  - generic [ref=e2131]:
                    - paragraph
                    - paragraph [ref=e2132]:
                      - strong [ref=e2133]: ¿Estás listo para dominar el arte de crear contenido que realmente conecte?
                    - paragraph [ref=e2134]: "Este curso es tu oportunidad de convertirte en un creador de contenido estratégico, sin importar si recién empezás o ya tenés experiencia en redes sociales. Dirigido a emprendedores, comunicadores, estudiantes, profesionales de marketing y cualquier persona que quiera potenciar su presencia digital, este programa te desafía a pensar como un verdadero storyteller audiovisual. Aprenderás a dominar cada elemento que hace que un video sea irresistible: desde la selección del plano perfecto que captura la atención instantánea, hasta el diseño sonoro que genera conexión emocional y las técnicas de montaje que mantienen a tu audiencia pegada a la pantalla. El desafío es ambicioso: en seis módulos prácticos y autogestivos, no solo descubrirás los secretos detrás de los contenidos más exitosos de TikTok, Instagram y YouTube, sino que desarrollarás tu propia voz creativa aplicando narrativa visual profesional, estrategias de engagement y las tendencias más actuales del ecosistema digital."
                    - paragraph [ref=e2135]:
                      - strong [ref=e2136]: ¡Animate a transformar tus ideas en contenido que genere impacto real y construya la audiencia que siempre quisiste tener!
                    - paragraph
                  - generic [ref=e2138]: "Duración del curso: 25 Horas"
