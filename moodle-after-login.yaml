                  - heading "Cómo crear tu perfil profesional en redes sociales" [level=3] [ref=e2103]:
                    - link "Cómo crear tu perfil profesional en redes sociales" [ref=e2104] [cursor=pointer]:
                      - /url: https://campus.aulavirtual.unc.edu.ar/course/view.php?id=263
                  - img "Self enrolment" [ref=e2106]: 
                - generic [ref=e2110]:
                  - generic [ref=e2112]:
                    - paragraph [ref=e2113]: Este curso te ayudará a construir tu perfil profesional en el mundo digital desde cero, combinando identidad personal con proyección laboral estratégica. Aprenderás a diferenciar el uso personal de las redes sociales del profesional, optimizando tu presencia en plataformas como LinkedIn, Instagram o TikTok según tu oficio o proyecto.
                    - paragraph [ref=e2114]: A través de videos breves y ejercicios prácticos, explorarás conceptos clave como marca personal y propuesta de valor. Realizarás ejercicios de introspección para identificar tus fortalezas, crearás tu pitch de presentación y diseñarás un esquema inicial de contenidos digitales auténticos.
                    - paragraph [ref=e2115]: El curso es autogestivo y está pensado para quienes usan redes sociales de manera básica pero quieren aprovecharlas profesionalmente. No necesitas conocimientos técnicos avanzados en comunicación digital. Al finalizar, habrás desarrollado las herramientas para mostrar lo que haces con claridad, autenticidad y visión estratégica, ampliando tus oportunidades de visibilidad en el ámbito laboral.
                  - list [ref=e2116]:
                    - listitem [ref=e2117]:
                      - text: "Teacher:"
                      - link "Guadalupe Limbrici Dagfal" [ref=e2118] [cursor=pointer]:
                        - /url: https://campus.aulavirtual.unc.edu.ar/user/profile.php?id=132123
                  - generic [ref=e2120]: "Duración del curso: 20 Horas"
