                - generic [ref=e1366]:
                  - generic [ref=e1368]:
                    - paragraph:
                      - strong
                    - paragraph [ref=e1369]: ¡Potenciá tu perfil profesional con la Certificación 1 de "Aprendiendo a caminar en Python"!
                    - paragraph [ref=e1370]: "Este curso autogestivo es la puerta de entrada ideal para quienes no tienen experiencia previa y buscan transformar su relación con la tecnología, pasando de ser usuarios pasivos a productores activos. A través de cinco módulos dinámicos, dominarás los fundamentos esenciales: desde la instalación de tu entorno de trabajo en Jupyter Notebook hasta la creación de algoritmos utilizando funciones, lógica booleana y estructuras de datos como diccionarios y listas."
                    - paragraph [ref=e1371]: "Lo que realmente distingue a esta certificación es su enfoque práctico. Como broche de oro, accederás a exclusivos \"Bonus Tracks\" donde aplicarás lo aprendido en proyectos reales:"
                    - paragraph [ref=e1372]: "• Automatización: Extraé texto de archivos PDF de forma masiva."
                    - paragraph [ref=e1373]: "• Alcance Global: Creá un traductor automático que soporta múltiples idiomas, incluido el guaraní."
                    - paragraph [ref=e1374]: "• Innovación: Desarrollá una \"inteligencia artificial de juguete\" capaz de generar textos coherentes mediante modelos probabilísticos."
                    - paragraph [ref=e1375]: No se trata solo de escribir código, sino de desarrollar un pensamiento computacional que te permita resolver problemas cotidianos con soluciones digitales avanzadas. ¡Es el momento de dejar de observar la tecnología y empezar a crearla!
                    - paragraph
