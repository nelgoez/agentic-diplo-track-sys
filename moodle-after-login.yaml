                - generic [ref=e757]:
                  - paragraph [ref=e760]:
                    - generic [ref=e761]: En este curso aprenderás a cuidarte y a cuidar de personas durante las altas temperaturas del verano y conocerás un poco más sobre las llamadas “olas de calor”. Evitarás enfermedades relacionadas con el calor. y conocerás los riesgos asociados a las altas temperaturas, aprenderás a identificar los signos de agotamiento por calor y golpe de calor y adquirirás conocimientos prácticos para mantener a las personas hidratadas y frescas.
