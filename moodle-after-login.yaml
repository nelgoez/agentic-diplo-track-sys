                      - text: "El curso está compuesto por módulos temáticos que se habilitan de forma progresiva a medida que completás las actividades propuestas. Incluye recursos concretos para que puedas fortalecer tu confianza al hablar en público: principios esenciales de la oratoria, ejercicios prácticos, materiales complementarios y desafíos que podés realizar a tu propio ritmo."
