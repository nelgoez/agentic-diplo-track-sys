                    - paragraph [ref=e2238]:
                      - text: Este curso autogestivo de 20hs de dedicación, te invita a transformar tu idea en un
                      - strong [ref=e2239]: plan de negocio claro, sólido y listo para comunicar
                      - text: . A lo largo del recorrido vas a incorporar metodologías y herramientas prácticas para diseñar un plan adaptado a las necesidades reales de tu proyecto emprendedor o institucional, con una mirada estratégica y aplicada.
                    - paragraph [ref=e2240]: En los distintos módulos aprenderás a estructurar cada componente clave del plan de negocio, desde la definición de la propuesta de valor, la misión y la visión, hasta el análisis del mercado y la competencia. Vas a identificar a tu cliente ideal, dimensionar oportunidades, detectar riesgos y tomar decisiones fundamentadas a partir de datos concretos.
                    - paragraph [ref=e2241]:
                      - text: También trabajarás en la definición de objetivos y estrategias comerciales, la organización operativa y la evaluación financiera básica de tu proyecto. Finalmente, desarrollarás un
                      - strong [ref=e2242]: resumen ejecutivo y un pitch persuasivo
                      - text: ", ideales para presentar tu idea ante aliados, instituciones o potenciales inversores. Al finalizar, contarás con un plan de negocio profesional que te permitirá avanzar con mayor claridad, foco y confianza."
