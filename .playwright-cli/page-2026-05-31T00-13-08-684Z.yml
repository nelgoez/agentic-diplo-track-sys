 Horas\",\"value\":\"30 Horas\"}]},{\"id\":56,\"fullname\":\"Trabajo Integrado de Google Drive\",\"displayname\":\"Trabajo Integrado de Google Drive\",\"shortname\":\"google-drive\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/409\\/course\\/overviewfiles\\/Trabajo%20Integrado%20de%20Google%20Drive.png\",\"categoryid\":42,\"categoryname\":\"Tecnolog\\u00eda e Inform\\u00e1tica\",\"sortorder\":130004,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Trabajo Integrado de Google Drive.png\",\"filepath\":\"\\/\",\"filesize\":307056,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/409\\/course\\/overviewfiles\\/Trabajo%20Integrado%20de%20Google%20Drive.png\",\"timemodified\":1699534028,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"45 Horas\",\"value\":\"45 Horas\"}]},{\"id\":57,\"fullname\":\"Reposter\\u00eda Tradicional Centroeuropea\",\"displayname\":\"Reposter\\u00eda Tradicional Centroeuropea\",\"shortname\":\"reposteria-centroeuropea\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/410\\/course\\/overviewfiles\\/Reposter%C3%ADa%20Tradicional%20Centroeuropea.png\",\"categoryid\":49,\"categoryname\":\"Gastronom\\u00eda\",\"sortorder\":200003,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Reposter\\u00eda Tradicional Centroeuropea.png\",\"filepath\":\"\\/\",\"filesize\":640662,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/410\\/course\\/overviewfiles\\/Reposter%C3%ADa%20Tradicional%20Centroeuropea.png\",\"timemodified\":1699533959,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"45 Horas\",\"value\":\"45 Horas\"}]},{\"id\":58,\"fullname\":\"Molder\\u00eda y Confecci\\u00f3n de Prendas - (Verano 2024)\",\"displayname\":\"Molder\\u00eda y Confecci\\u00f3n de Prendas - (Verano 2024)\",\"shortname\":\"MolderiaConfeccionPrendas\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/411\\/course\\/overviewfiles\\/Molder%C3%ADa%20y%20confecci%C3%B3n%20de%20prendas.png\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60014,\"summary\":\"<p>Este curso de confecci\\u00f3n de prendas, est\\u00e1 enfocado a conocer en profundidad el proceso y la transformaci\\u00f3n de prendas como Pantal\\u00f3n, Camperas, Ropa \\u00edntima, traje de ba\\u00f1o, buzo deportivo, faldas, entre otras.<\\/p>\\r\\n<p>Comprender\\u00e1s cada paso y avanzar\\u00e1s progresivamente para obtener prendas a tu medida.<\\/p>\\r\\n<p>El proceso se desarrolla desde toma de medidas, realizaci\\u00f3n del molde, corte de telas, hasta la costura y las terminaciones de cada prenda para que puedas<\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Docentes: <\\/span><\\/b>Equipo Interdisciplinario<\\/p>\\r\\n<p>Campus Virtual<\\/p>\\r\\n<p>Universidad Nacional de C\\u00f3rdoba<\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">\\u00a0<\\/span><\\/b><\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Temario: <\\/span><\\/b><\\/p>\\r\\n<p>M\\u00f3dulo 1: Medidas y moldes<\\/p>\\r\\n<p>M\\u00f3dulo 2: Confecci\\u00f3n de remera y vestido<\\/p>\\r\\n<p>M\\u00f3dulo 3: Confecci\\u00f3n de bikini, ropa \\u00edntima y traje de ba\\u00f1o<\\/p>\\r\\n<p>M\\u00f3dulo 4: Confecci\\u00f3n de buzo y campera rompevientos.<\\/p>\\r\\n<p>M\\u00f3dulo 5: Confecci\\u00f3n de pantal\\u00f3n y bolsillos<\\/p>\\r\\n<p>M\\u00f3dulo 6: Confecci\\u00f3n de faldas y tips de costuras<\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Duraci\\u00f3n:<\\/span><\\/b> 15hs<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Molder\\u00eda y confecci\\u00f3n de prendas.png\",\"filepath\":\"\\/\",\"filesize\":826735,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/411\\/course\\/overviewfiles\\/Molder%C3%ADa%20y%20confecci%C3%B3n%20de%20prendas.png\",\"timemodified\":1699533785,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"5 Horas\",\"value\":\"5 Horas\"}]},{\"id\":59,\"fullname\":\"Direcci\\u00f3n y Gesti\\u00f3n de Proyectos\",\"displayname\":\"Direcci\\u00f3n y Gesti\\u00f3n de Proyectos\",\"shortname\":\"direccion-proyectos\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/413\\/course\\/overviewfiles\\/Direcci%C3%B3n%20y%20Gesti%C3%B3n%20de%20Proyectos.png\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190020,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><\\/p><p>En este curso aprender\\u00e1s herramientas claves para planificar y dirigir proyectos de manera efectiva. Conocer\\u00e1s los fundamentos de la gesti\\u00f3n de proyectos, el rol de la direcci\\u00f3n y la importancia de la triple restricci\\u00f3n, optimizando recursos para garantizar el cumplimiento de los objetivos planteados.<\\/p><p>Est\\u00e1 dirigido a cualquier persona interesada en la gesti\\u00f3n de proyectos, sin necesidad de experiencia previa.<\\/p><p><i>Este curso es virtual, gratuito y con certificaci\\u00f3n incluida. Pod\\u00e9s cursarlo a tu propio ritmo y completarlo seg\\u00fa