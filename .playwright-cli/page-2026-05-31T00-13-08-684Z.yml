- generic [ref=e2]: "{\"courses\":[{\"id\":1,\"fullname\":\"Campus Virtual UNC\",\"displayname\":\"Campus Virtual UNC\",\"shortname\":\"CAMPUS VIRTUAL\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/2\\/course\\/generated\\/course.svg\",\"categoryid\":0,\"categoryname\":\"\",\"sortorder\":1,\"summary\":\"<div class=\\\"moodle-container\\\"><h1>M\\u00f3dulo I: La ley en la era digital<\\/h1><h2>1. Introducci\\u00f3n a la regulaci\\u00f3n online<\\/h2><p>Vivimos en un mundo digital. Todos los d\\u00edas interactuamos con plataformas, aplicaciones y redes sociales que requieren nuestra informaci\\u00f3n. Nos exponemos a riesgos que pueden derivar en fraudes, estafas y otros delitos inform\\u00e1ticos.<\\/p><div class=\\\"alert-box\\\"><strong>\\u00bfQu\\u00e9 significa que existan leyes en el \\u00e1mbito virtual? \\u00bfPor qu\\u00e9 necesitamos conocerlas?<\\/strong><\\/div><p>Hablar de regulaciones en el mundo online es hablar de <strong>\\\"Derecho Digital\\\"<\\/strong>. As\\u00ed como existen el Derecho Laboral o Civil, esta rama aparece para cubrir las necesidades de la virtualidad:<\\/p><div class=\\\"definition-box\\\"><strong>DERECHO DIGITAL:<\\/strong> Aquella rama del Derecho que regula el uso de tecnolog\\u00edas digitales, internet y la informaci\\u00f3n en l\\u00ednea. Busca proteger nuestros derechos, garantizar la privacidad y establecer reglas claras para el manejo de datos y servicios digitales.<\\/div><h2>2. Leyes Nacionales e Internacionales<\\/h2><p>En Argentina contamos con leyes fundamentales que protegen nuestra actividad digital:<\\/p><div class=\\\"laws-grid\\\"><div class=\\\"law-card\\\"><h3>Ley de Protecci\\u00f3n de Datos Personales (N\\u00b0 25.326)<\\/h3><p>Protege toda informaci\\u00f3n que identifique a una persona. Regula la recolecci\\u00f3n, almacenamiento y uso, estableciendo el <strong>consentimiento<\\/strong> como requisito fundamental.<\\/p><\\/div><div class=\\\"law-card\\\"><h3>C\\u00f3digo Penal de la Naci\\u00f3n Argentina<\\/h3><p>Contiene las normas que sancionan delitos relacionados con fraudes, estafas y dem\\u00e1s delitos inform\\u00e1ticos.<\\/p><\\/div><div class=\\\"law-card\\\"><h3>Ley de Propiedad Intelectual (Ley N\\u00b0 11.723)<\\/h3><p>Protege creaciones como m\\u00fasica, software y obras digitales, asegurando la autorizaci\\u00f3n de sus autores.<\\/p><\\/div><div class=\\\"law-card\\\"><h3>Ley de Firma Digital (Ley N\\u00b0 25.506)<\\/h3><p>Reconoce la validez legal de las firmas en \\u00e1mbitos digitales.<\\/p><\\/div><\\/div><h3 style=\\\"margin-top:30px;\\\">Contexto Internacional<\\/h3><p>Argentina y Uruguay lideran la regi\\u00f3n en protecci\\u00f3n de datos. A nivel global, nos complementamos con:<\\/p><ul><li><strong>RGPD (Uni\\u00f3n Europea):<\\/strong> Est\\u00e1ndares m\\u00e1ximos de privacidad y derechos de acceso\\/supresi\\u00f3n.<\\/li><li><strong>Convenci\\u00f3n de Budapest:<\\/strong> Acuerdo internacional para combatir la cibercriminalidad.<\\/li><li><strong>Normas UNESCO:<\\/strong> Promueven la libertad de expresi\\u00f3n y ciudadan\\u00eda digital.<\\/li><\\/ul><h2>3. Las Buenas Pr\\u00e1cticas<\\/h2><p>Son comportamientos recomendados que ayudan a proteger nuestra seguridad cuando no hay una regla jur\\u00eddica espec\\u00edfica. Dado que la tecnolog\\u00eda avanza m\\u00e1s r\\u00e1pido que las leyes, estas pr\\u00e1cticas son vitales:<\\/p><table class=\\\"comparison-table\\\"><thead><tr><th>Aspecto<\\/th><th>Leyes<\\/th><th>Buenas Pr\\u00e1cticas<\\/th><\\/tr><\\/thead><tbody><tr><td><strong>Car\\u00e1cter<\\/strong><\\/td><td>Obligatorias por norma.<\\/td><td>No obligatorias pero recomendables.<\\/td><\\/tr><tr><td><strong>Funci\\u00f3n<\\/strong><\\/td><td>Marco de protecci\\u00f3n legal.<\\/td><td>Abordan situaciones nuevas (ej. IA).<\\/td><\\/tr><tr><td><strong>Evoluci\\u00f3n<\\/strong><\\/td><td>Procesos legislativos lentos.<\\/td><td>Adaptaci\\u00f3n veloz al avance virtual.<\\/td><\\/tr><\\/tbody><\\/table><div class=\\\"quote-box\\\">\\\"\\u00bfQu\\u00e9 sucede con una imagen generada por IA que afecta la integridad de otra persona? Existen herramientas legales generales, pero no una norma espec\\u00edfica directa. Aqu\\u00ed las buenas pr\\u00e1cticas nos permiten ejercer control y minimizar riesgos.\\\"<\\/div><h2>4. Aceptar T\\u00e9rminos y Condiciones<\\/h2><p>Este acto implica un contrato digital donde autorizamos un uso espec\\u00edfico y temporal de nuestros datos. <strong>No perdemos la propiedad de los mismos.<\\/strong><\\/p><div class=\\\"alert-box\\\" style=\\\"border-left:5px solid;\\\"><strong>Regla de Oro:<\\/strong> Las plataformas solo pueden exigir datos indispensables para el funcionamiento b\\u00e1sico del servicio. No deber\\u00edan obligarnos a aceptar condiciones innecesarias (como perfiles comerciales) para usar lo b\\u00e1sico.<\\/div><div class=\\\"quote-box\\\">\\\"Aunque no leamos las condiciones, al aceptar nos obligamos. Pero si alguna condici\\u00f3n fuera ilegal o nos privara de derechos protegidos, podemos reclamar y hacer valer tales derechos.\\\"<\\/div><h3>\\u00bfY las Cookies?<\\/h3><p>Son formas de recolectar informaci\\u00f3n de navegaci\\u00f3n alcanzadas por la Ley 25.326. La diferencia clave es:<\\/p><ul><li><strong>T\\u00e9rminos y Condiciones:<\\/strong> Obligatorios para usar la plataforma.<\\/li><li><strong>Cookies:<\\/strong> Muchas veces es posible rechazar las no necesarias (publicidad\\/estad\\u00edsticas) y entrar igual al sitio.<\\/li><\\/ul><h2 style=\\\"border:none;padding:0;\\\">\\u201cLo bueno es que nunca me va a pasar a m\\u00ed\\u201d<\\/h2><p style=\\\"max-width:700px;margin:0 auto;\\\">Una frase incorrecta. Actuamos de manera constante en el mundo virtual: pagamos deudas, abrimos mails, compartimos contenido. Sin darnos cuenta, damos lugar a diversas consecuencias legales cada d\\u00eda.<\\/p><h4>Bibliograf\\u00eda y Fuentes:<\\/h4><p>C\\u00f3digo Penal de la Naci\\u00f3n Argentina | Constituci\\u00f3n Nacional Argentina | Ley 11.723 (Propiedad Intelectual) | Ley 25.326 (Protecci\\u00f3n de Datos Personales) | RGPD (Uni\\u00f3n Europea) | Directrices UNESCO (2023).<\\/p><\\/div>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[],\"showactivitydates\":false,\"showcompletionconditions\":null,\"contacts\":[],\"enrollmentmethods\":[],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}],\"format\":\"site\",\"showgrades\":1,\"newsitems\":2,\"startdate\":0,\"enddate\":0,\"maxbytes\":0,\"showreports\":0,\"visible\":1,\"groupmode\":0,\"groupmodeforce\":0,\"defaultgroupingid\":0,\"enablecompletion\":0,\"completionnotify\":0,\"lang\":\"\",\"theme\":\"\",\"marker\":0,\"filters\":[{\"filter\":\"displayh5p\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"activitynames\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"mathjaxloader\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"emoticon\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"urltolink\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"mediaplugin\",\"localstate\":0,\"inheritedstate\":1}]},{\"id\":3,\"fullname\":\"Mujeres Emprendedoras: Herramientas para emprender con perspectiva de g\\u00e9nero\",\"displayname\":\"Mujeres Emprendedoras: Herramientas para emprender con perspectiva de g\\u00e9nero\",\"shortname\":\"mujeres-emprendedoras\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/27\\/course\\/overviewfiles\\/Mujeres%20emprendedoras%20-%20Herramientas%20para%20emprender%20con%20perspectiva%20de%20g%C3%A9nero.png\",\"categoryid\":17,\"categoryname\":\"G\\u00e9nero y Derechos Humanos\",\"sortorder\":30009,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Mujeres emprendedoras - Herramientas para emprender con perspectiva de g\\u00e9nero.png\",\"filepath\":\"\\/\",\"filesize\":489077,\"fileurl\":\"http