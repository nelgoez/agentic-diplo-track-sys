ocesos de innovaci\\u00f3n abierta\",\"shortname\":\"metodologias-agiles\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/420\\/course\\/overviewfiles\\/METODO~2.PNG\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190015,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"METODO~2.PNG\",\"filepath\":\"\\/\",\"filesize\":726597,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/420\\/course\\/overviewfiles\\/METODO~2.PNG\",\"timemodified\":1699534554,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":67,\"fullname\":\"Generaci\\u00f3n de emprendimientos de Base Tecnol\\u00f3gica\",\"displayname\":\"Generaci\\u00f3n de emprendimientos de Base Tecnol\\u00f3gica\",\"shortname\":\"emprendimientos-tecnologica\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/421\\/course\\/overviewfiles\\/Generaci%C3%B3n%20de%20emprendimientos%20de%20Base%20Tecnol%C3%B3gica.png\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190021,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Generaci\\u00f3n de emprendimientos de Base Tecnol\\u00f3gica.png\",\"filepath\":\"\\/\",\"filesize\":779286,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/421\\/course\\/overviewfiles\\/Generaci%C3%B3n%20de%20emprendimientos%20de%20Base%20Tecnol%C3%B3gica.png\",\"timemodified\":1699534335,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":68,\"fullname\":\"Ciudades en letras, m\\u00fasica y cine\",\"displayname\":\"Ciudades en letras, m\\u00fasica y cine\",\"shortname\":\"ciudades-letras\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/422\\/course\\/overviewfiles\\/Ciudades%20en%20letras%2C%20m%C3%BAsica%20y%20cine.png\",\"categoryid\":43,\"categoryname\":\"Arquitectura y Dise\\u00f1o\",\"sortorder\":140004,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><strong>Formulario de Inscripci\\u00f3n:<\\/strong><\\/p><p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><span style=\\\"font-size:0.9375rem;\\\"><a href=\\\"https:\\/\\/docs.google.com\\/forms\\/d\\/e\\/1FAIpQLSep7oxX_pTKTOCcmHQ7IUSewSc8TrfPaMlIq3WGRtwOSVaUJA\\/viewform\\\">\\u00a1Inscribite ac\\u00e1!<\\/a><\\/span><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Ciudades en letras, m\\u00fasica y cine.png\",\"filepath\":\"\\/\",\"filesize\":737715,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/422\\/course\\/overviewfiles\\/Ciudades%20en%20letras%2C%20m%C3%BAsica%20y%20cine.png\",\"timemodified\":1699534197,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"60 Horas\",\"value\":\"60 Horas\"}]},{\"id\":82,\"fullname\":\"Gesti\\u00f3n emocional para vivir mejor - (Verano 2024)\",\"displayname\":\"Gesti\\u00f3n emocional para vivir mejor - (Verano 2024)\",\"shortname\":\"Gestion_Emocional\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/609\\/course\\/overviewfiles\\/Gesti%C3%B3n%20emocional%20para%20vivir%20mejor.png\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60007,\"summary\":\"<p>El curso propone un recorrido te\\u00f3rico-pr\\u00e1ctico sobre el mundo de las emociones, con el objetivo de aprender a identificar, entender y gestionar las mismas.<\\/p>\\r\\n<p><b>\\u00a0<\\/b><\\/p>\\r\\n<p><b>DOCENTE: Lic. Rodrigo Ezequiel Jaldo<\\/b><\\/p>\\r\\n<p><b>TEMARIO:<\\/b><\\/p>\\r\\n<p><b>M\\u00f3dulo 1: El mundo de las emociones<\\/b><\\/p>\\r\\n<p>Qu\\u00e9 son las emociones. Definici\\u00f3n completa del concepto.<\\/p>\\r\\n<p>An\\u00e1lisis de cada elemento de la definici\\u00f3n, con ejemplos cotidianos. Validaci\\u00f3n emocional. Componentes de las emociones (fisiolog\\u00eda, pensamientos, comportamientos y factor social). Diferencia entre emociones y sentimientos. Episodios emocionales. Ejemplos de episodios emocionales (secuencial y en paralelo). Estado del \\u00e1nimo. Como influyen entre s\\u00ed las emociones y el estado del \\u00e1nimo.<\\/p>\\r\\n<p><b>M\\u00f3dulo 2: Aprendiendo a gestionar nuestras emociones<\\/b><\\/p>\\r\\n<p>Gesti\\u00f3n emocional: Definici\\u00f3n y an\\u00e1lisis de cada elemento del concepto. Consecuencias funcionales y disfuncionales. Gesti\\u00f3n intra e interpersonal, con ejemplos cotidianos. Competencias Emocionales. Ingredientes emocionales. Emociones primarias y su significado: tristeza, alegr\\u00eda, enojo, sorpresa, aceptaci\\u00f3n, asco, anticipaci\\u00f3n, miedo. Paso a paso para gestionar nuestras emociones.<\\/p>\\r\\n<p><b>M\\u00f3dulo 3: Gesti\\u00f3n interna de las emociones<\\/b><\\/p>\\r\\n<p>Las emociones en nuestro cuerpo. Componente fisiol\\u00f3gico de las emociones. Malestar emocional. Neurotransmisores y hormonas que influyen en las emociones. Pautas generales para cualquier emoci\\u00f3n. Gesti\\u00f3n detallada de la ansiedad (qu\\u00e9 es la ansiedad; fisiolog\\u00eda de la ansiedad; t\\u00e9cnicas de respiraci\\u00f3n y relajaci\\u00f3n). Componente cognitivo de las emociones. Sesgos cognitivos: pensamiento dicot\\u00f3mico; catastrofismo; inferencias arbitrarias; filtro negativo; adivinaci\\u00f3n; personalismos. Los pensamientos son interpretaciones. Interpretaciones alternativas. Reformulaci\\u00f3n. Reevaluaci\\u00f3n.<\\/p>\\r\\n<p><b>M\\u00f3dulo 4: Gesti\\u00f3n de las conductas emocionales<\\/b><\\/p>\\r\\n<p>Componente comportamental de las emociones. Impulsos emocionales. Conductas de evitaci\\u00f3n. Gesti\\u00f3n de las conductas emocionales. Conductas alternativas. Componente social de las emociones. Mandatos sociales. Culpa. Verg\\u00fcenza. Autonom\\u00eda emocional. L\\u00edmites sanos. Desahogo emocional. Comunicaci\\u00f3n asertiva. Resoluci\\u00f3n de conflictos con otras personas.<\\/p>\\r\\n<p><b>DURACI\\u00d3N: 20 hs<\\/b><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Gesti\\u00f3n emocional para vivir mejor.png\",\"filepath\":\"\\/\",\"filesize\":860781,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/609\\/course\\/overviewfiles\\/Gesti%C3%B3n%20emocional%20para%20vivir%20mejor.png\",\"timemodified\":1708963572,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":83,\"fullname\":\"Curso Introductorio a los Derechos Sexuales y (NO) Reproductivos desde una perspectiva de g\\u00e9nero\",\"displayname\":\"Curso Introductorio a los Derechos Sexuales y (NO) Reproductivos desde una perspectiva de g\\u00e9nero\",\"shortname\":\"derechos-sexuales\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/632\\/course\\/overviewfiles\\/Curso%20Introductorio%20a%20los%20Derechos%20Sexuales%20y%20%28NO%29%20Reproductivos%20desde%20una%20perspectiva%20de%20g%C3%A9nero.png\",\"categoryid\":17,\"categoryname\":\"G\\u00e9nero y Derechos Humanos\",\"sortorder\":30002,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Curso Introductorio a los Derechos Sexuales y (NO) Reproductivos desde una perspectiva de g\\u00e9nero.png\",\"filepath\":\"\\/\",\"filesize\":543245,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/632\\/course\\/overviewfiles\\/Curso%20Introductorio%20a%20los%20Derechos%20Sexuales%20y%20%28NO%29%20Reproductivos%20desde%20una%20perspectiva%20de%20g%C3%A9nero.png\",\"timemodified\":1719843136,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"50 Horas\",\"value\":\"50 Horas\"}]},{\"id\":111,\"fullname\":\"Soldadura El\\u00e9ctrica - (Verano 2024)\",\"displayname\":\"Soldadura El\\u00e9ctrica - (Verano 2024)\",\"shortname\":\"SoldaduraEl\\u00e9ctrica\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/1139\\/course\\/overviewfiles\\/Soldadura%20el%C3%A9ctrica.png\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60017,\"summary\":\"<p>En este Curso de Soldadura El\\u00e9ctrica, veremos desde una breve rese\\u00f1a hist\\u00f3rica, concepto b\\u00e1sico de la soldadura, las ventajas y desventajas de la soldadura el\\u00e9ctrica<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">\\u00a0<\\/span><\\/b><\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Docentes: <\\/span><\\/b>Diego Bustos<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">\\u00a0<\\/span><\\/b><\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Temario:<\\/span><\\/b><\\/p>\\r\\n<p>M\\u00d3DULO 1: INTRODUCCI\\u00d3N<\\/p>\\r\\n<p>M\\u00d3DULO 2: EL EQUIPO DE SOLDADURA<\\/p>\\r\\n<p>M\\u00d3DULO 3: TIPOS Y T\\u00c9CNICAS DE SOLDADURA<\\/p>\\r\\n<p>M\\u00d3DULO 4: HERRAMIENTAS Y MATERIALES<\\/p>\\r\\n<p>M\\u00d3DULO 5: COMENZANDO A SOLDAR: TRABAJO PR\\u00c1CTICO<\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Duraci\\u00f3n: <\\/span><\\/b>45 hs<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[{\"filename\":\"Soldadura el\\u00e9ctrica.png\",\"filepath\":\"\\/\",\"filesize\":744517,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/1139\\/course\\/summary\\/Soldadura%20el%C3%A9ctrica.png\",\"timemodified\":1747405096,\"mimetype\":\"image\\/png\",\"isexternalfile\":false,\"icon\":\"f\\/image\"}],\"overviewfiles\":[{\"filename\":\"Soldadura el\\u00e9ctrica.png\",\"filepath\":\"\\/\",\"filesize\":744517,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/1139\\/course\\/overviewfiles\\/Soldadura%20el%C3%A9ctrica.png\",\"timemodified\":1701710794,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"45 Horas\",\"value\":\"45 Horas\"}]},{\"id\":112,\"fullname\":\"3 Claves para lanzar tu marca personal\",\"displayname\":\"3 Claves para lanzar tu marca personal\",\"shortname\":\"marca-personal\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/1141\\/course\\/overviewfiles\\/Generaci%C3%B3n%20de%20emprendimientos%20de%20Base%20Tecnol%C3%B3gica.png\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190002,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Generaci\\u00f3n de emprendimientos de Base Tecnol\\u00f3gica.png\",\"filepath\":\"\\/\",\"filesize\":779286,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/1141\\/course\\/overviewfiles\\/Generaci%C3%B3n%20de%20emprendimientos%20de%20Base%20Tecnol%C3%B3gica.png\",\"timemodified\":1719852182,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"36 Horas\",\"value\":\"36 Horas\"}]},{\"id\":113,\"fullname\":\"Operario Certificado de Limpieza Institucional\",\"displayname\":\"Operario Certificado de Limpieza Institucional\",\"shortname\":\"operario-limpieza\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/1588\\/course\\/overviewfiles\\/unnamed.jpg\",\"categoryid\":30,\"categoryname\":\"Oficios\",\"sortorder\":50004,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><\\/p><p><strong>Curso de Operario Certificado en Limpieza Institucional \\u2013 Capacitaci\\u00f3n Virtual<\\/strong><\\/p><p>\\u00a1Prep\\u00e1rate para abrir nuevas oportunidades laborales en el sector de limpieza institucional! Este curso virtual est\\u00e1 dise\\u00f1ado para brindarte las herramientas necesarias para desempe\\u00f1arte de manera eficiente en establecimientos educativos, de salud y comunidades aisladas de la provincia de C\\u00f3rdoba, garantizando un trabajo seguro y de calidad.<\\/p><p>A lo largo del programa, abordar\\u00e1s\\u00a0conocimientos t\\u00e9cnicos espec\\u00edficos de limpieza y aprender\\u00e1n a trabajar de forma segura, cumpliendo con normas de higiene, seguridad y legislaci\\u00f3n laboral. Adem\\u00e1s, adquirir\\u00e1s nociones de atenci\\u00f3n al cliente, interpretaci\\u00f3n de recibos de sueldo, gesti\\u00f3n de conflictos y prevenci\\u00f3n de violencia laboral y de g\\u00e9nero.<\\/p><p>El curso combina clases virtuales con autoevaluaciones en cada m\\u00f3dulo. Al completar todas las evaluaciones con \\u00e9xito, los participantes recibir\\u00e1n un certificado que valida su formaci\\u00f3n y los prepara para insertarse profesionalmente en el sector de limpieza institucional.<\\/p><p><strong>Contenidos principales:<\\/strong><\\/p><ul><li><p>Manejo de productos qu\\u00edmicos y cuidado del medio ambiente.<\\/p><\\/li><li><p>T\\u00e9cnicas de limpieza de superficies, pisos, ba\\u00f1os, cocinas y grandes \\u00e1reas.<\\/p><\\/li><li><p>Trabajo en equipo, comunicaci\\u00f3n asertiva y resoluci\\u00f3n de conflictos.<\\/p><\\/li><li><p>Primeros auxilios: RCP, desobstrucci\\u00f3n de v\\u00edas respiratorias y tratamiento de quemaduras.<\\/p><\\/li><\\/ul><p>Sumate a esta capacitaci\\u00f3n y adquiere los conocimientos y competencias que te abrir\\u00e1n las puertas a un empleo formal y seguro en la provincia de C\\u00f3rdoba.<\\/p><br \\/><p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"unnamed.jpg\",\"filepath\":\"\\/\",\"filesize\":31017,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/1588\\/course\\/overviewfiles\\/unnamed.jpg\",\"timemodified\":1759434873,\"mimetype\":\"image\\/jpeg\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":114,\"fullname\":\"Ergonom\\u00eda y Autocuidado en actividades de la vida cotidiana\",\"displayname\":\"Ergonom\\u00eda y Autocuidado en actividades de la vida cotidiana\",\"shortname\":\"ergonomia-cotidiana\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/1590\\/course\\/overviewfiles\\/Ergonom%C3%ADa%20del%20autocuidado%20en%20tiempos%20de%20teletrabajo.png\",\"categoryid\":41,\"categoryname\":\"Desarrollo Personal y Bienestar\",\"sortorder\":120011,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Ergonom\\u00eda d