d\":1699533767,\"mimetype\":\"image\\/jpeg\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":17,\"fullname\":\"UNC sobre Ruedas\",\"displayname\":\"UNC sobre Ruedas\",\"shortname\":\"unc-ruedas\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/370\\/course\\/overviewfiles\\/UNC%20sobre%20ruedas.png\",\"categoryid\":45,\"categoryname\":\"Recreaci\\u00f3n, Deporte y Movimiento\",\"sortorder\":160007,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"UNC sobre ruedas.png\",\"filepath\":\"\\/\",\"filesize\":615263,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/370\\/course\\/overviewfiles\\/UNC%20sobre%20ruedas.png\",\"timemodified\":1699534653,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":18,\"fullname\":\"Jardiner\\u00eda Vertical y Cuadros Vivos - (Verano 2024)\",\"displayname\":\"Jardiner\\u00eda Vertical y Cuadros Vivos - (Verano 2024)\",\"shortname\":\"Jardiner\\u00edaverticalycuadrosvivos\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/371\\/course\\/overviewfiles\\/Jardineria%20vertical%20y%20cuadros%20vivos.png\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60010,\"summary\":\"<p>En este curso queremos que te inicies en el amplio mundo los CUADROS VIVOS son una excelente soluci\\u00f3n para llenar de vida espacios vac\\u00edos de un ambiente. Y lo mejor de todo es que son beneficiosos para la armon\\u00eda del hogar y la salud, ya que, generan ox\\u00edgeno y a su vez absorben di\\u00f3xido de carbono. Tambi\\u00e9n retienen los gases contaminantes que vienen del exterior por lo cual son ideales para departamentos y casas con poco espacio.<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Temario:<\\/span><\\/b><\\/p>\\r\\n<p>M\\u00f3dulo 1: Introducci\\u00f3n al mundo de la jardiner\\u00eda vertical<\\/p>\\r\\n<p>M\\u00f3dulo 2: Cuadro vivo para interior<\\/p>\\r\\n<p>M\\u00f3dulo 3: cuadro vivo para exterior<\\/p>\\r\\n<p>M\\u00f3dulo 4: huerta vertical de arom\\u00e1ticas<\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Duraci\\u00f3n: <\\/span><\\/b>30 hs.<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Jardineria vertical y cuadros vivos.png\",\"filepath\":\"\\/\",\"filesize\":972286,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/371\\/course\\/overviewfiles\\/Jardineria%20vertical%20y%20cuadros%20vivos.png\",\"timemodified\":1699534076,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":19,\"fullname\":\"Construcci\\u00f3n de Termotanques Solares Sustentables\",\"displayname\":\"Construcci\\u00f3n de Termotanques Solares Sustentables\",\"shortname\":\"termotanques-solares\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/372\\/course\\/overviewfiles\\/Construcci%C3%B3n%20de%20Termotanques%20Solares%20Sustentables.png\",\"categoryid\":46,\"categoryname\":\"Jardiner\\u00eda, Vida Verde y Medio Ambiente\",\"sortorder\":170008,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Construcci\\u00f3n de Termotanques Solares Sustentables.png\",\"filepath\":\"\\/\",\"filesize\":568885,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/372\\/course\\/overviewfiles\\/Construcci%C3%B3n%20de%20Termotanques%20Solares%20Sustentables.png\",\"timemodified\":1699534056,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":20,\"fullname\":\"Servicios Tur\\u00edsticos\",\"displayname\":\"Servicios Tur\\u00edsticos\",\"shortname\":\"servicios-turisticos\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/373\\/course\\/overviewfiles\\/Servicios%20tur%C3%ADsticos.png\",\"categoryid\":47,\"categoryname\":\"Oficios y T\\u00e9cnicas Manuales\",\"sortorder\":180015,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Servicios tur\\u00edsticos.png\",\"filepath\":\"\\/\",\"filesize\":508810,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/373\\/course\\/overviewfiles\\/Servicios%20tur%C3%ADsticos.png\",\"timemodified\":1699533985,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":21,\"fullname\":\"Confecci\\u00f3n, arreglos y reciclado de indumentaria - (Verano 2024)\",\"displayname\":\"Confecci\\u00f3n, arreglos y reciclado de indumentaria - (Verano 2024)\",\"shortname\":\"Confecci\\u00f3n,arreglosyreciclado\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/374\\/course\\/overviewfiles\\/Confecci%C3%B3n%20arreglo%20y%20reciclado%20de%20indumentaria.png\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60004,\"summary\":\"<p>En este curso, te damos la clave y te lo explicaremos de manera simple y transparente. Podr\\u00e1s dar gusto a los ni\\u00f1os con las prendas que puedan desear. Tendr\\u00e1s la oportunidad de dise\\u00f1ar ropa para j\\u00f3venes y damas. Con estas pocas orientaciones podr\\u00e1s innovar de manera exitosa en la materia. \\u00a1Todo lo necesario para emprend https:\\/\\/edx.campus virtual.unc.edu.ar\\/er un camino en la confecci\\u00f3n, arreglo y reciclado de prendas!<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">\\u00a0<\\/span><\\/b><\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Duraci\\u00f3n: <\\/span><\\/b>45 hs.<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Confecci\\u00f3n arreglo y reciclado de indumentaria.png\",\"filepath\":\"\\/\",\"filesize\":651845,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/374\\/course\\/overviewfiles\\/Confecci%C3%B3n%20arreglo%20y%20reciclado%20de%20indumentaria.png\",\"timemodified\":1699533640,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"45 Horas\",\"value\":\"45 Horas\"}]},{\"id\":22,\"fullname\":\"Mi Propio Jard\\u00edn - (Verano 2024)\",\"displayname\":\"Mi Propio Jard\\u00edn - (Verano 2024)\",\"shortname\":\"MiPropioJard\\u00edn\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/375\\/course\\/overviewfiles\\/Mi%20propio%20jard%C3%ADn.png\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60013,\"summary\":\"<p>Este curso est\\u00e1 destinado a emprendedores y amantes de la na