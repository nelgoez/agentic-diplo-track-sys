:\"30 Horas\"}]},{\"id\":35,\"fullname\":\"Curso de Chi Kung para la Salud Baduanjin - (Verano 2024)\",\"displayname\":\"Curso de Chi Kung para la Salud Baduanjin - (Verano 2024)\",\"shortname\":\"ChiKungSaludBaduanjin\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/388\\/course\\/overviewfiles\\/Chi%20Kung%20para%20la%20salud%20Baduanjin.png\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60003,\"summary\":\"<p>En este curso podr\\u00e1s ver conjuntos de ejercicios f\\u00edsicos especialmente indicados para conseguir y mantener un buen estado f\\u00edsico general de salud a trav\\u00e9s del trabajo de la Energ\\u00eda en el tiempo, las 8 piezas de Brocado.<\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Docentes:<\\/span><\\/b><\\/p>\\r\\n<p>Gabriel A. Kfouri, Rosana Franchino.<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">\\u00a0<\\/span><\\/b><\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Temario:<\\/span><\\/b><\\/p>\\r\\n<p>CLASE I: Presentaci\\u00f3n, movilidad articular y muscular, desarrollo de los ejercicios 1 y 2.<br \\/> Estiramiento.<br \\/> CLASE II: Movilidad articular y muscular, desarrollo de los ejercicios 3 y 4.<br \\/> Estiramiento.<br \\/> CLASE III: Movilidad articular y muscular, desarrollo de los ejercicios 5 y 6.<br \\/> Estiramiento.<br \\/> CLASE IV: Movilidad articular y muscular, desarrollo de los ejercicios 7 y 8.<br \\/> Estiramiento.<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Duraci\\u00f3n: <\\/span><\\/b>30 hs.<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Chi Kung para la salud Baduanjin.png\",\"filepath\":\"\\/\",\"filesize\":391051,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/388\\/course\\/overviewfiles\\/Chi%20Kung%20para%20la%20salud%20Baduanjin.png\",\"timemodified\":1699466455,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":36,\"fullname\":\"De Peones a Reyes - Ajedrez Avanzado en la UNC - (Verano 2024)\",\"displayname\":\"De Peones a Reyes - Ajedrez Avanzado en la UNC - (Verano 2024)\",\"shortname\":\"AjedrezAvanzadoUNC\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/389\\/course\\/overviewfiles\\/DEPEON~1.PNG\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60002,\"summary\":\"<p>La UNC implementa el ajedrez social como herramienta pedag\\u00f3gica transformadora, a trav\\u00e9s de este juego milenario.Quienes hayan completado el primer curso \\u201cDe Peones a Reyes- Curso Inicial\\u201d podr\\u00e1n ahora aprender nociones de estrategia, t\\u00e1ctica y finales. Ideal para avanzar en la comprensi\\u00f3n del juego.<\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Docentes:<\\/span><\\/b><\\/p>\\r\\n<p>Guillermo Zoppe, Juan Carlos Carranza y Guillermo Llanos.<\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Temario:<\\/span><\\/b><\\/p>\\r\\n<p>Cap\\u00edtulo 1: La aventura del desarrollo.<\\/p>\\r\\n<p>Cap\\u00edtulo 2: Mates simples y complejos.<\\/p>\\r\\n<p>Cap\\u00edtulo 3: Coronaci\\u00f3n de peones.<\\/p>\\r\\n<p>Cap\\u00edtulo 4: Medio juego. Generales de la batalla.<\\/p>\\r\\n<p>Cap\\u00edtulo 5: Final de partida. La consumaci\\u00f3n de la victoria.<\\/p>\\r\\n<p>Cap\\u00edtulo 6: Ejemplos. Las manos maestras.<\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Duraci\\u00f3n: <\\/span><\\/b>30 hs.<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"DEPEON~1.PNG\",\"filepath\":\"\\/\",\"filesize\":560834,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/389\\/course\\/overviewfiles\\/DEPEON~1.PNG\",\"timemodified\":1699466692,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"5 Horas\",\"value\":\"5 Horas\"}]},{\"id\":37,\"fullname\":\"Ense\\u00f1ar en la Virtualidad\",\"displayname\":\"Ense\\u00f1ar en la Virtualidad\",\"shortname\":\"ense\\u00f1anza-virtualidad\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/390\\/course\\/overviewfiles\\/Ense%C3%B1ar%20en%20la%20virtualidad.png\",\"categoryid\":44,\"categoryname\":\"Educaci\\u00f3n y Formaci\\u00f3n Docente\",\"sortorder\":150011,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Ense\\u00f1ar en la virtualidad.png\",\"filepath\":\"\\/\",\"filesize\":543316,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/390\\/course\\/overviewfiles\\/Ense%C3%B1ar%20en%20la%20virtualidad.png\",\"timemodified\":1699534268,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":38,\"fullname\":\"Habilidades comunicativas para el aula universitaria\",\"displayname\":\"Habilidades comunicativas para el aula universitaria\",\"shortname\":\"habilidades-comunicativas\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/391\\/course\\/overviewfiles\\/HABILI~1.PNG\",\"categoryid\":44,\"categoryname\":\"Educaci\\u00f3n y Formaci\\u00f3n Docente\",\"sortorder\":150010,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"HABILI~1.PNG\",\"filepath\":\"\\/\",\"filesize\":414369,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/391\\/course\\/overviewfiles\\/HABILI~1.PNG\",\"timemodified\":1699539878,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"45 Horas\",\"value\":\"45 Horas\"}]},{\"id\":39,\"fullname\":\"Entrenamiento en Casa - (Verano 2024)\",\"displayname\":\"Entrenamiento en Casa - (Verano 2024)\",\"shortname\":\"EntrenamientoCasa\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/392\\/course\\/overviewfiles\\/Entrenamiento%20en%20casa.png\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60005,\"summary\":\"<p><span style=\\\"font-size:0.9375rem;\\\">El ejercicio ayuda a mejorar el estado de \\u00e1nimo y a liberar la tensi\\u00f3n. Durante estos d\\u00edas en casa por la cuarentena, tanto psic\\u00f3logos como nutricionistas acent\\u00faan que es fundamental hacer ejercicio a diario para obtener todos sus beneficios f\\u00edsicos y mentales. Estas rutinas de ejercicios est\\u00e1n dise\\u00f1adas para que puedas divertirte y sentirte bien.<\\/span><br \\/><\\/p>\\r\\n<p>\\u00a0<\\/p>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Docentes:<\\/span><\\/b><\\/p>\\r\\n<h3><\\/h3><h3>Angelo Fabi\\u00e1n Pollastrini<\\/h3><br \\/>\\r\\n<p><b><span style=\\\"text-decoration:underline;\\\">Duraci\\u00f3n: <\\/span><\\/b>30 hs.<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[{\"filename\":\"11.png\",\"filepath\":\"\\/\",\"filesize\":25377,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/392\\/course\\/summary\\/11.png\",\"timemodified\":1747404994,\"mimetype\":\"image\\/png\",\"isexternalfile\":false,\"icon\":\"f\\/image\"}],\"overviewfiles\":[{\"filename\":\"Entrenamiento en casa.png\",\"filepath\":\"\\/\",\"filesize\":522336,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/392\\/course\\/overviewfiles\\/Entrenamiento%20en%20casa.png\",\"timemodified\":1699466810,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\",\"self\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":40,\"fullname\":\"Curso de Tai Chi Chuan para la Salud - (Verano 2024)\",\"displayname\":\"Curso de Tai Chi Chuan para la Salud - (Verano 2024)\",\"shortname\":\"TaiChiChuanSalud\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/393\\/course\\/overviewfiles\\/Tai%20Chi%20Cuan%20para%20la%20salud.png\",\"categoryid\":21,\"categoryname\":\"Cursos de verano 2024\",\"sortorder\":60018,\"summary\":\"<p><strong>Esfuerzo estimado: 30 h<\\/strong><\\/p>\\r\\n<p>El Tai chi chuan es el arte marcial m\\u00e1s popular, esto se debe a los beneficios que aporta a la salud. El primer efecto ser\\u00e1 una sensaci\\u00f3n de bienestar en todo el cuerpo.<\\/p>\\r\\n<p>El Tai chi se relaciona con la existencia de los 5 elementos: tierra, agua, fuego, metal y madera, los cuales, en un ciclo continuo, interact\\u00faan e influyen en todos los aspectos de la vida, alimentaci\\u00f3n, sue\\u00f1o, personalidad y tambi\\u00e9n en la salud.<\\/p>\\r\\n<p><i>Este curso es virtual, gratuito y con certificaci\\u00f3n incluida. Pod\\u00e9s cursarlo a tu propio ritmo y completarlo seg\\u00fan tu conveniencia.<\\/i><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Tai Chi Cuan para la salud.png\",\"filepath\":\"\\/\",\"filesize\":525904,\"fileurl\":\"https:\