ido en proyectos reales:<\\/p><p dir=\\\"ltr\\\">\\u2022 Automatizaci\\u00f3n: Extra\\u00e9 texto de archivos PDF de forma masiva.<\\/p><p dir=\\\"ltr\\\">\\u2022 Alcance Global: Cre\\u00e1 un traductor autom\\u00e1tico que soporta m\\u00faltiples idiomas, incluido el guaran\\u00ed.<\\/p><p dir=\\\"ltr\\\">\\u2022 Innovaci\\u00f3n: Desarroll\\u00e1 una \\\"inteligencia artificial de juguete\\\" capaz de generar textos coherentes mediante modelos probabil\\u00edsticos.<\\/p><p dir=\\\"ltr\\\">No se trata solo de escribir c\\u00f3digo, sino de desarrollar un pensamiento computacional que te permita resolver problemas cotidianos con soluciones digitales avanzadas. \\u00a1Es el momento de dejar de observar la tecnolog\\u00eda y empezar a crearla!<\\/p><p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Aprendiendo-a-caminar-en-Python-Certificacion-1-700x350.png\",\"filepath\":\"\\/\",\"filesize\":314937,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/220855\\/course\\/overviewfiles\\/Aprendiendo-a-caminar-en-Python-Certificacion-1-700x350.png\",\"timemodified\":1767463055,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}],\"format\":\"onetopic\",\"showgrades\":0,\"newsitems\":5,\"startdate\":1764126000,\"enddate\":0,\"maxbytes\":0,\"showreports\":0,\"visible\":1,\"groupmode\":0,\"groupmodeforce\":0,\"defaultgroupingid\":0,\"enablecompletion\":1,\"completionnotify\":0,\"lang\":\"\",\"theme\":\"\",\"marker\":0,\"filters\":[{\"filter\":\"displayh5p\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"activitynames\",\"localstate\":-1,\"inheritedstate\":1},{\"filter\":\"mathjaxloader\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"emoticon\",