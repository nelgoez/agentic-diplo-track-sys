o\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":228,\"fullname\":\"Taller de bordado a mano: Intervenci\\u00f3n de prendas\",\"displayname\":\"Taller de bordado a mano: Intervenci\\u00f3n de prendas\",\"shortname\":\"bordado-prendas\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/100036\\/course\\/overviewfiles\\/Taller%20de%20Bordado%20a%20mano%20-%20Intervenci%C3%B3n%20de%20prendas.png\",\"categoryid\":47,\"categoryname\":\"Oficios y T\\u00e9cnicas Manuales\",\"sortorder\":180001,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Taller de Bordado a mano - Intervenci\\u00f3n de prendas.png\",\"filepath\":\"\\/\",\"filesize\":922199,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/100036\\/course\\/overviewfiles\\/Taller%20de%20Bordado%20a%20mano%20-%20Intervenci%C3%B3n%20de%20prendas.png\",\"timemodified\":1735571699,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":229,\"fullname\":\"Soy FAUD\",\"displayname\":\"Soy FAUD\",\"shortname\":\"soy-faud\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/124438\\/course\\/overviewfiles\\/SOY-FAUD-100x500.png\",\"categoryid\":43,\"categoryname\":\"Arquitectura y Dise\\u00f1o\",\"sortorder\":140001,\"summary\":\"<p style=\\\"text-align:justify;\\\"><br \\/><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"SOY-FAUD-100x500.png\",\"filepath\":\"\\/\",\"filesize\":544184,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/124438\\/course\\/overviewfiles\\/SOY-FAUD-100x500.png\",\"timemodified\":1748618521,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"25 Horas\",\"value\":\"25 Horas\"}]},{\"id\":235,\"fullname\":\"Oratoria y presentaciones p\\u00fablicas efectivas\",\"displayname\":\"Oratoria y presentaciones p\\u00fablicas efectivas\",\"shortname\":\"Oratoria (efectiva)\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/165078\\/course\\/overviewfiles\\/Oratoria.png\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190012,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><strong id=\\\"docs-internal-guid-b7126bbf-7fff-80c3-639e-ec1564b22420\\\"><\\/strong><\\/p>\\r\\n<p dir=\\\"ltr\\\"><strong><\\/strong><\\/p><div><span>Te damos la bienvenida al curso virtual de Oratoria y presentaciones P\\u00fablicas Efectivas. A lo largo de esta capacitaci\\u00f3n gratuita, vas a incorporar herramientas clave para mejorar tu expresi\\u00f3n oral y aprender a comunicarte con claridad, seguridad y persuasi\\u00f3n en distintos contextos: acad\\u00e9micos, laborales o personales.<\\/span><\\/div><span>El curso est\\u00e1 compuesto por m\\u00f3dulos tem\\u00e1ticos que se habilitan de forma progresiva a medida que complet\\u00e1s las actividades propuestas. Incluye recursos concretos para que puedas fortalecer tu confianza al hablar en p\\u00fablico: principios esenciales de la oratoria, ejercicios pr\\u00e1cticos, materiales complementarios y desaf\\u00edos que pod\\u00e9s realizar a tu propio ritmo.<br \\/>Esta propuesta se destaca por su enfoque pr\\u00e1ctico, autogestivo y orientado a la acci\\u00f3n: cada etapa est\\u00e1 pensada para que desarrolles habilidades aplicables en situaciones reales de comunicaci\\u00f3n.<br \\/>Te invitamos a sumarte a este recorrido formativo que te acerca a dominar el arte de hablar en p\\u00fablico, desde una experiencia personalizada, flexible y accesible.<\\/span><p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Oratoria.png\",\"filepath\":\"\\/\",\"filesize\":657966,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/165078\\/course\\/overviewfiles\\/Oratoria.png\",\"timemodified\":1753386550,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":236,\"fullname\":\"Estrategias de marca para negocios sostenibles: herramientas para alinear identidad, comunicaci\\u00f3n y modelo de negocio\",\"displayname\":\"Estrategias de marca para negocios sostenibles: herramientas para alinear identidad, comunicaci\\u00f3n y modelo de negocio\",\"shortname\":\"estrategias-marca\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/167196\\/course\\/generated\\/course.svg\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190024,\"summary\":\"<p><span id=\\\"docs-internal-guid-4a88fc1b-7fff-7c48-2b36-00904114b534\\\" style=\\\"font-family:'courier new', courier, monospace;font-size:small;\\\">\\u00a0<\\/span><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"40 Horas\",\"value\":\"40 Horas\"}]},{\"id\":238,\"fullname\":\"Captar audiencias y sumar clics: Videos profesionales para redes sociales (re-edici\\u00f3n)\",\"displayname\":\"Captar audiencias y sumar clics: Videos profesionales para redes sociales (re-edici\\u00f3n)\",\"shortname\":\"audiencias_clics_1\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/172857\\/course\\/generated\\/course.svg\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190005,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><b id=\\\"docs-internal-guid-b7126bbf-7fff-80c3-639e-ec1564b22420\\\"><\\/b><\\/p><p dir=\\\"ltr\\\"><strong>\\u00bfEst\\u00e1s listo para dominar el arte de crear contenido que realmente conecte?<\\/strong><\\/p><p dir=\\\"ltr\\\"> Este curso es tu oportunidad de convertirte en un creador de contenido estrat\\u00e9gico, sin importar si reci\\u00e9n empez\\u00e1s o ya ten\\u00e9s experiencia en redes sociales. Dirigido a emprendedores, comunicadores, estudiantes, profesionales de marketing y cualquier persona que quiera potenciar su presencia digital, este programa te desaf\\u00eda a pensar como un verdadero storyteller audiovisual. Aprender\\u00e1s a dominar cada elemento que hace que un video sea irresistible: desde la selecci\\u00f3n del plano perfecto que captura la atenci\\u00f3n instant\\u00e1nea, hasta el dise\\u00f1o sonoro que genera conexi\\u00f3n emocional y las t\\u00e9cnicas de montaje que mantienen a tu audiencia pegada a la pantalla. El desaf\\u00edo es ambicioso: en seis m\\u00f3dulos pr\\u00e1cticos y autogestivos, no solo descubrir\\u00e1s los secretos detr\\u00e1s de los contenidos m\\u00e1s exitosos de TikTok, Instagram y YouTube, sino que desarrollar\\u00e1s tu propia voz creativa aplicando narrativa visual profesional, estrategias de engagement y las tendencias m\\u00e1s actuales del ecosistema digital.<\\/p><p dir=\\\"ltr\\\"><strong>\\u00a1Animate a transformar tus ideas en contenido que genere impacto real y construya la audiencia que siempre quisiste tener!<\\/strong><br \\/><\\/p><br \\/><br \\/><p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"25 Horas\",\"value\":\"25 Horas\"}]},{\"id\":239,\"fullname\":\"Propiedad Intelectual como herramienta estrat\\u00e9gica para la innovaci\\u00f3n\",\"displayname\":\"Propiedad Intelectual como herramienta estrat\\u00e9gica para la innovaci\\u00f3n\",\"shortname\":\"propiedad-intelectual\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/175808\\/course\\/overviewfiles\\/propiedad-intelectual.jpg\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190014,\"summary\":\"<p><br \\/><\\/p>\\r\\n<p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"propiedad-intelectual.jpg\",\"filepath\":\"\\/\",\"filesize\":321365,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/175808\\/course\\/overviewfiles\\/propiedad-intelectual.jpg\",\"timemodified\":1750344683,\"mimetype\":\"image\\/jpeg\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[{\"id\":99374,\"fullname\":\"Maria Lorena Talbot Wright\"}],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":241,\"fullname\":\"Prevenci\\u00f3n de estafas virtuales\",\"displayname\":\"Prevenci\\u00f3n de estafas virtuales\",\"shortname\":\"Estafas virtuales\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/177541\\/course\\/generated\\/course.svg\",\"categoryid\":34,\"categoryname\":\"\",\"sortorder\":70033,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\">En este curso desarrollar\\u00e1s las habilidades para r<span>econocer las principales modalidades de estafas virtuales y los factores tecnol\\u00f3gicos, sociales y comportamentales que las posibilitan\\u00a0<\\/span><span id=\\\"docs-internal-guid-a8398521-7fff-60c5-7fe2-b2dd3df73064\\\">y adoptar conductas preventivas que disminuyan la vulnerabilidad ante fraudes digitales.<\\/span><\\/p>\\r\\n<p><\\/p>\\r\\n<p><\\/p>\\r\\n<p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":242,\"fullname\":\"Estrategias de marca para negocios sostenibles: herramientas para alinear identidad, comunicaci\\u00f3n y modelo de negocio\",\"displayname\":\"Estrategias de marca para negocios sostenibles: herramientas para alinear identidad, comunicaci\\u00f3n y modelo de negocio\",\"shortname\":\"estrategias-negocio\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/182670\\/course\\/generated\\/course.svg\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190023,\"summary\":\"<p>A lo largo de esta capacitaci\\u00f3n gratuita, vas a acompa\\u00f1ar el proceso de relanzamiento de Ay! Juana, una marca real que busca volver al mercado con una propuesta renovada y estrat\\u00e9gica. Junto a Manuel Bomheker, un asesor especializado en branding, vas a conocer de cerca cada paso del proceso: desde los primeros diagn\\u00f3sticos hasta la definici\\u00f3n final de una estrategia de comunicaci\\u00f3n s\\u00f3lida y con proyecci\\u00f3n.<\\/p><p>El curso est\\u00e1 organizado en cinco m\\u00f3dulos que combinan videos, materiales pr\\u00e1cticos, recursos complementarios y consignas pensadas para que trabajes directamente sobre tu propio proyecto. A medida que avances, vas a poder aplicar herramientas concretas para dise\\u00f1ar tu propio modelo de negocios y construir una marca coherente, con sentido y alineada a tus objetivos personales o profesionales.<\\/p><p>Esta propuesta no se enfoca exclusivamente en el uso de redes sociales. El objetivo es que desarrolles una mirada integral de tu marca: entendida como un sistema estrat\\u00e9gico, capaz de crecer, adaptarse y diferenciarse en el tiempo. Al finalizar el curso, vas a contar con una hoja de ruta clara para tomar decisiones con mayor confianza y claridad.<\\/p><p>Te invitamos a sumarte a esta experiencia de aprendizaje pensada para acompa\\u00f1arte en la creaci\\u00f3n o fortalecimiento de tu marca, junto a una comunidad que comparte tus mismos desaf\\u00edos.<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"40 Horas\",\"value\":\"40 Horas\"}]},{\"id\":247,\"fullname\":\"Pruebas Vero\",\"displayname\":\"Pruebas Vero\",\"shortname\":\"PV2025\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/200296\\/course\\/generated\\/course.svg\",\"categoryid\":34,\"categoryname\":\"\",\"sortorder\":70032,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[],\"showactivitydates\":true,\"showcompletionconditions\":null,\"contacts\":[{\"id\":47018,\"fullname\":\"Ver\\u00f3nica Andrea Gonzalez Marquez\"}],\"enrollmentmethods\":[\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":259,\"fullname\":\"Trayecto Electivo - Diplomatura Universitaria de Formaci\\u00f3n Continua en Creaci\\u00f3n y Gesti\\u00f3n de Emprendimientos\",\"displayname\":\"Trayecto Electivo - Diplomatura Universitaria de Formaci\\u00f3n Continua en Creaci\\u00f3n y Gesti\\u00f3n de Emprendimientos\",\"shortname\":\"TE - DUCyGE\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/209279\\/course\\/generated\\/course.svg\",\"categoryid\":38,\"categoryname\":\"\",\"sortorder\":90001,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[],\"showactivitydates\":true,\"showcompletionconditions\":null,\"contacts\":[{\"id\":47018,\"fullname\":\"Ver\\u00f3nica Andrea Gonzalez Marquez\"}],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"-\",\"value\":\"-\"}]},{\"id\":261,\"fullname\":\"Elaboraci\\u00f3n de Plan de Negocios\",\"displayname\":\"Elaboraci\\u00f3n de Plan de Negocios\",\"shortname\":\"plan-negocios\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/212380\\/course\\/overviewfiles\\/Elaboracion-de-plan-de-negocios-700x350.png\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190017,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><\\/p><p>Este curso autogestivo de 20hs de dedicaci\\u00f3n, te invita a transformar tu idea en un <strong>plan de negocio claro, s\\u00f3lido y listo para comunicar<\\/strong>. A lo largo del recorrido vas a incorporar metodolog\\u00edas y herramientas pr\\u00e1cticas para dise\\u00f1ar un plan adaptado a las necesidades reales de tu proyecto emprendedor o institucional, con una mirada estrat\\u00e9gica y aplicada.<\\/p>\\r\\n<p>En los distintos m\\u00f3dulos aprender\\u00e1s a estructurar cada componente clave del plan de negocio, desde la definici\\u00f3n de la propuesta de valor, la misi\\u00f3n y la visi\\u00f3n, hasta el an\\u00e1lisis del mercado y la competencia. Vas a identificar a tu cliente ideal, dimensionar oportunidades, detectar riesgos y tomar decisiones fundamentadas a partir de datos concretos.<\\/p>\\r\\n<p>Tambi\\u00e9n trabajar\\u00e1s en la definici\\u00f3n de objetivos y estrategias comerciales, la organizaci\\u00f3n operativa y la evaluaci\\u00f3n financiera b\\u00e1sica de tu proyecto. Finalmente, desarrollar\\u00e1s un <strong>resumen ejecutivo y un pitch persuasivo<\\/strong>, ideales para presentar tu idea ante aliados, instituciones o potenciales inversores. Al finalizar, contar\\u00e1s con un plan de negocio profesional que te permitir\\u00e1 avanzar con mayor claridad, foco y confianza.<\\/p><br \\/><p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Elaboracion-de-plan-de-negocios-700x350.png\",\"filepath\":\"\\/\",\"filesize\":246824,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/212380\\/course\\/overviewfiles\\/Elaboracion-de-plan-de-negocios-700x350.png\",\"timemodified\":1767463318,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":262,\"fullname\":\"Armado de CV y carta de presentaci\\u00f3n\",\"displayname\":\"Armado de CV y carta de presentaci\\u00f3n\",\"shortname\":\"cv-presentaci\\u00f3n\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/212382\\/course\\/overviewfiles\\/Armado-de-CV-y-carta-de-presentacion-700x350.png\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190016,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><span>Este curso autogestivo de 20 horas est\\u00e1 dise\\u00f1ado para ayudarte a destacarte en procesos de b\\u00fasqueda laboral y comunicar tu perfil profesional de manera clara, estrat\\u00e9gica y actualizada. A lo largo del recorrido vas a adquirir las herramientas necesarias para crear un Curriculum Vitae y una Carta de Presentaci\\u00f3n efectivos, adaptados a distintos contextos laborales, sectores y plataformas digitales.<br \\/>Aprender\\u00e1s a poner en valor tu experiencia, tus habilidades y tu potencial, alineando tu perfil con lo que hoy buscan las organizaciones y los equipos de selecci\\u00f3n. El curso te gu\\u00eda paso a paso para optimizar tus materiales seg\\u00fan portales de empleo, entornos virtuales y sistemas de filtrado, incorporando criterios actuales de reclutamiento y lectura r\\u00e1pida.<br \\/>Con actividades pr\\u00e1cticas, ejemplos concretos y retroalimentaci\\u00f3n, podr\\u00e1s revisar, mejorar y profesionalizar tu presentaci\\u00f3n laboral. Al finalizar, contar\\u00e1s con recursos listos para usar y la seguridad de comunicar qui\\u00e9n sos y qu\\u00e9 pod\\u00e9s aportar, aumentando tus oportunidades de inserci\\u00f3n y crecimiento profesional.<\\/span><br \\/><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Armado-de-CV-y-carta-de-presentacion-700x350.png\",\"filepath\":\"\\/\",\"filesize\":226461,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/212382\\/course\\/overviewfiles\\/Armado-de-CV-y-carta-de-presentacion-700x350.png\",\"timemodified\":1767463118,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":263,\"fullname\":\"C\\u00f3mo crear tu perfil profesional en redes sociales\",\"displayname\":\"C\\u00f3mo crear tu perfil profesional en redes sociales\",\"shortname\":\"perfil-profesional\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/213160\\/course\\/overviewfiles\\/Como-armar-tu-perfil-profesional-en-redes-sociales--700x350.png\",\"categoryid\":48,\"categoryname\":\"Emprendedurismo y Negocios\",\"sortorder\":190004,\"summary\":\"<p>Este curso te ayudar\\u00e1 a construir tu perfil profesional en el mundo digital desde cero, combinando identidad personal con proyecci\\u00f3n laboral estrat\\u00e9gica. Aprender\\u00e1s a diferenciar el uso personal de las redes sociales del profesional, optimizando tu presencia en plataformas como LinkedIn, Instagram o TikTok seg\\u00fan tu oficio o proyecto.<\\/p>\\r\\n<p>A trav\\u00e9s de videos breves y ejercicios pr\\u00e1cticos, explorar\\u00e1s conceptos clave como marca personal y propuesta de valor. Realizar\\u00e1s ejercicios de introspecci\\u00f3n para identificar tus fortalezas, crear\\u00e1s tu pitch de presentaci\\u00f3n y dise\\u00f1ar\\u00e1s un esquema inicial de contenidos digitales aut\\u00e9nticos.<\\/p>\\r\\n<p>El curso es autogestivo y est\\u00e1 pensado para quienes usan redes sociales de manera b\\u00e1sica pero quieren aprovecharlas profesionalmente. No necesitas conocimientos t\\u00e9cnicos avanzados en comunicaci\\u00f3n digital. Al finalizar, habr\\u00e1s desarrollado las herramientas para mostrar lo que haces con claridad, autenticidad y visi\\u00f3n estrat\\u00e9gica, ampliando tus oportunidades de visibilidad en el \\u00e1mbito laboral.<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Como-armar-tu-perfil-profesional-en-redes-sociales--700x350.png\",\"filepath\":\"\\/\",\"filesize\":296194,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/213160\\/course\\/overviewfiles\\/Como-armar-tu-perfil-profesional-en-redes-sociales--700x350.png\",\"timemodified\":1767463008,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[{\"id\":132123,\"fullname\":\"Guadalupe Limbrici Dagfal\"}],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":264,\"fullname\":\"Comunicaci\\u00f3n asertiva en parejas\",\"displayname\":\"Comunicaci\\u00f3n asertiva en parejas\",\"shortname\":\"Comu Pareja\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/214092\\/course\\/overviewfiles\\/Comunicacion-asertiva-para-parejas-1-700x350.png\",\"categoryid\":22,\"categoryname\":\"Bienestar y Salud\",\"sortorder\":20004,\"summary\":\"<p><span style=\\\"font-size:0.9375rem;\\\"><strong>\\u00bfTu relaci\\u00f3n se enreda en malentendidos? \\u00bfSientes que no logran ponerse de acuerdo?<\\/strong><\\/span><\\/p>\\r\\n<p><span style=\\\"font-size:0.9375rem;\\\">Este curso autogestivo es para vos si quer\\u00e9s transformar la forma en que te comunic\\u00e1s con tu pareja. A trav\\u00e9s de 5 cap\\u00edtulos interactivos con casos reales, aprender\\u00e1s a\\u00a0<\\/span><span style=\\\"font-size:0.9375rem;\\\">c<\\/span><span style=\\\"font-size:0.9375rem;\\\">onstruir acuerdos genuinos que respeten a ambos; comunicarte con claridad y escucha efectiva; gestionar conflictos de manera constructiva; reconstruir la conexi\\u00f3n despu\\u00e9s de las peleas; y mantener viva la chispa con rituales y seducci\\u00f3n consciente.<\\/span><\\/p>\\r\\n<p>Vas a descubrir que el \\\"felices para siempre\\\" no existe... \\u00a1y eso es lo mejor! Porque una pareja sana se construye d\\u00eda a d\\u00eda, con di\\u00e1logo honesto, l\\u00edmites claros y acuerdos que evolucionan con ustedes.<\\/p>\\r\\n<p><span style=\\\"font-size:0.9375rem;\\\">\\u00bfListo para dejar de discutir y empezar a dialogar?<\\/span><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Comunicacion-asertiva-para-parejas-1-700x350.png\",\"filepath\":\"\\/\",\"filesize\":257842,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/214092\\/course\\/overviewfiles\\/Comunicacion-asertiva-para-parejas-1-700x350.png\",\"timemodified\":1767463148,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":false,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":265,\"fullname\":\"Yoga y Mindfulness para la vida cotidiana\",\"displayname\":\"Yoga y Mindfulness para la vida cotidiana\",\"shortname\":\"Yoga y Mindfulnes\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/216572\\/course\\/overviewfiles\\/Yoga-y-Mindfulness-para-la-vida-cotidiana-700x350.png\",\"categoryid\":41,\"categoryname\":\"Desarrollo Personal y Bienestar\",\"sortorder\":120003,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><strong><\\/strong><\\/p><p dir=\\\"ltr\\\"><span id=\\\"docs-internal-guid-589866b6-7fff-5cc1-a31d-e0b8d83002d3\\\"><\\/span><\\/p><p>Este curso autogestivo te propone un <strong>espacio de pausa, conexi\\u00f3n y bienestar<\\/strong> en medio del ritmo acelerado de la vida cotidiana. A trav\\u00e9s de un recorrido sereno y accesible, vas a incorporar los fundamentos del <strong>yoga y el mindfulness<\\/strong> como herramientas concretas para regular las emociones, reducir el estr\\u00e9s y cultivar una mayor presencia en tu d\\u00eda a d\\u00eda.<\\/p>\\r\\n<p>A lo largo de tres m\\u00f3dulos, combinar\\u00e1s conceptos claros con <strong>pr\\u00e1cticas simples de movimiento, respiraci\\u00f3n y atenci\\u00f3n plena<\\/strong>, guiadas por una docente especialista. No necesit\\u00e1s experiencia previa ni condiciones f\\u00edsicas especiales: el curso est\\u00e1 pensado para que avances a tu propio ritmo, escuchando tu cuerpo y desarrollando una mirada m\\u00e1s consciente sobre tus h\\u00e1bitos y estados internos.<\\/p>\\r\\n<p>Mediante videos, materiales complementarios y actividades de autoevaluaci\\u00f3n, vas a integrar peque\\u00f1os gestos de calma aplicables a lo cotidiano. Al finalizar, contar\\u00e1s con recursos pr\\u00e1cticos para vivir con mayor equilibrio, claridad y bienestar integral.<\\/p><br \\/><p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Yoga-y-Mindfulness-para-la-vida-cotidiana-700x350.png\",\"filepath\":\"\\/\",\"filesize\":275113,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/216572\\/course\\/overviewfiles\\/Yoga-y-Mindfulness-para-la-vida-cotidiana-700x350.png\",\"timemodified\":1767463434,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"10 Horas\",\"value\":\"10 Horas\"}]},{\"id\":267,\"fullname\":\"IA y automatizaci\\u00f3n de flujos de trabajo: aprende a automatizar de forma eficaz y eficiente\",\"displayname\":\"IA y automatizaci\\u00f3n de flujos de trabajo: aprende a automatizar de forma eficaz y eficiente\",\"shortname\":\"IA y automatizaci\\u00f3n \",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/220058\\/course\\/overviewfiles\\/IA-y-automatizacion-de-flujo-de-trabajo-aprende-a-automatizar-de-forma-eficiente-y-eficaz--700x350.png\",\"categoryid\":42,\"categoryname\":\"Tecnolog\\u00eda e Inform\\u00e1tica\",\"sortorder\":130006,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><\\/p><p>Este curso autogestivo te propone dar un paso concreto hacia el <strong>mundo de la automatizaci\\u00f3n y la inteligencia artificial aplicada<\\/strong>, incorporando herramientas clave que hoy demandan las organizaciones. A lo largo del recorrido aprender\\u00e1s a <strong>dise\\u00f1ar y ejecutar flujos de trabajo automatizados<\\/strong> utilizando herramientas No-Code y Low-Code, con foco en N8N, sin necesidad de programaci\\u00f3n avanzada.<\\/p>\\r\\n<p>Desde los conceptos fundamentales de automatizaci\\u00f3n, workflows e IA, hasta la 