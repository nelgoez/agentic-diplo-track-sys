lf\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"10 Horas\",\"value\":\"10 Horas\"}]},{\"id\":272,\"fullname\":\"Tatuaje Profesional: nociones t\\u00e9cnicas, bioseguridad y \\u00e9tica para tatuadores\",\"displayname\":\"Tatuaje Profesional: nociones t\\u00e9cnicas, bioseguridad y \\u00e9tica para tatuadores\",\"shortname\":\"Tatuaje Profesional\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/222003\\/course\\/overviewfiles\\/Tatuaje-Profesional-tecnica-bioseguridad-y-etica-para-tatuadores-700x350.png\",\"categoryid\":47,\"categoryname\":\"Oficios y T\\u00e9cnicas Manuales\",\"sortorder\":180003,\"summary\":\"<p>\\u00bfQuer\\u00e9s iniciarte en el mundo del tatuaje con una base profesional y responsable? Este curso es la puerta de entrada ideal para quienes buscan transformar su inter\\u00e9s art\\u00edstico en un oficio serio. En solo 12 horas de formaci\\u00f3n intensiva, vas a descubrir los pilares que separan a un aficionado de un profesional consciente.<\\/p>\\r\\n<p>Aprender\\u00e1s a interpretar el tatuaje como un lenguaje visual, comprendiendo la arquitectura del dise\\u00f1o y c\\u00f3mo este debe adaptarse a la tridimensionalidad del cuerpo humano. Exploraremos la ciencia de la piel para que entiendas d\\u00f3nde debe alojarse el pigmento y c\\u00f3mo funciona el proceso de cicatrizaci\\u00f3n. Tambi\\u00e9n te daremos las herramientas para reconocer el equipamiento t\\u00e9cnico, comprender los protocolos de bioseguridad necesarios para proteger a tus clientes y establecer un marco \\u00e9tico de trabajo.<\\/p>\\r\\n<p>Es el primer paso fundamental para construir tu autoridad en el sector y empezar a trazar tu camino con responsabilidad y excelencia profesionalizar tu pasi\\u00f3n.<\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Tatuaje-Profesional-tecnica-bioseguridad-y-etica-para-tatuadores-700x350.png\",\"filepath\":\"\\/\",\"filesize\":224657,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/222003\\/course\\/overviewfiles\\/Tatuaje-Profesional-tecnica-bioseguridad-y-etica-para-tatuadores-700x350.png\",\"timemodified\":1767463413,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"12 Horas\",\"value\":\"12 Horas\"}]},{\"id\":273,\"fullname\":\"Corte de cabello masculino\",\"displayname\":\"Corte de cabello masculino\",\"shortname\":\"Peluquer\\u00eda \",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/222114\\/course\\/overviewfiles\\/Corte-de-cabello-masculino-700x350.png\",\"categoryid\":47,\"categoryname\":\"Oficios y T\\u00e9cnicas Manuales\",\"sortorder\":180002,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><strong><\\/strong><\\/p><p dir=\\\"ltr\\\"><span id=\\\"docs-internal-guid-197cba0c-7fff-2987-1efe-8e58e55783fa\\\">Este recorrido est\\u00e1 pensado para acercarte a un oficio con historia y t\\u00e9cnica y pasi\\u00f3n. A lo largo de tres m\\u00f3dulos, vas a conocer c\\u00f3mo se ha desarrollado la peluquer\\u00eda a lo largo del tiempo, cu\\u00e1l es la misi\\u00f3n de un peluquero profesional, cu\\u00e1les son las bases t\\u00e9cnicas para comprender la estructura del cr\\u00e1neo y c\\u00f3mo estas se aplican en el proceso de corte.<\\/span><\\/p><span>El objetivo es que te animes a practicar con confianza, desarrollando un lenguaje t\\u00e9cnico s\\u00f3lido y una mirada profesional. No necesit\\u00e1s experiencia previa: solo curiosidad, un peine, y ganas de aprender.<\\/span><br \\/><p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Corte-de-cabello-masculino-700x350.png\",\"filepath\":\"\\/\",\"filesize\":231156,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/222114\\/course\\/overviewfiles\\/Corte-de-cabello-masculino-700x350.png\",\"timemodified\":1767463263,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"10 Horas\",\"value\":\"10 Horas\"}]},{\"id\":276,\"fullname\":\"Aprendiendo a caminar en Python - Certificaci\\u00f3n 2\",\"displayname\":\"Aprendiendo a caminar en Python - Certificaci\\u00f3n 2\",\"shortname\":\"python-2\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/224803\\/course\\/overviewfiles\\/Aprendiendo-a-caminar-en-Python-Certificacion-2-700x350.png\",\"categoryid\":42,\"categoryname\":\"Tecnolog\\u00eda e Inform\\u00e1tica\",\"sortorder\":130002,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><strong><\\/strong><\\/p><p dir=\\\"ltr\\\">\\u00a1Dale un impulso definitivo a tu carrera profesional!<\\/p><p dir=\\\"ltr\\\">\\u00bfYa conoces la sintaxis b\\u00e1sica? Es hora de dejar de escribir c\\u00f3digo suelto y empezar a construir soluciones reales. La Certificaci\\u00f3n 2: Aprendiendo a caminar en Python es tu entrada directa al mundo del An\\u00e1lisis de Datos, una de las habilidades m\\u00e1s demandadas del mercado.<\\/p><p dir=\\\"ltr\\\">No solo aprender\\u00e1s a programar; entrenar\\u00e1s tu mente para pensar con l\\u00f3gica avanzada. Dominar\\u00e1s el \\\"stack\\\" tecnol\\u00f3gico que usan los expertos: NumPy para procesar grandes vol\\u00famenes de informaci\\u00f3n y Matplotlib para convertir n\\u00fameros fr\\u00edos en visualizaciones de alto impacto.<\\/p><p dir=\\\"ltr\\\">Con una modalidad 100% flexible y enfocada en la pr\\u00e1ctica, cerrar\\u00e1s el curso con un Proyecto Integrador listo para mostrar en tu portafolio.<\\/p><p dir=\\\"ltr\\\">Deja de aprender teor\\u00eda y empieza a transformar datos en decisiones. \\u00a1Inscr\\u00edbete ahora y lleva tu perfil al siguiente nivel!<\\/p><p><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[{\"filename\":\"Aprendiendo-a-caminar-en-Python-Certificacion-2-700x350.png\",\"filepath\":\"\\/\",\"filesize\":294876,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/224803\\/course\\/overviewfiles\\/Aprendiendo-a-caminar-en-Python-Certificacion-2-700x350.png\",\"timemodified\":1767463081,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"15 Horas\",\"value\":\"15 Horas\"}],\"format\":\"onetopic\",\"showgrades\":0,\"newsitems\":5,\"startdate\":1766545200,\"enddate\":0,\"maxbytes\":0,\"showreports\":1,\"visible\":1,\"groupmode\":0,\"groupmodeforce\":0,\"defaultgroupingid\":0,\"enablecompletion\":1,\"completionnotify\":0,\"lang\":\"\",\"theme\":\"\",\"marker\":0,\"filters\":[{\"filter\":\"displayh5p\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"activitynames\",\"localstate\":-1,\"inheritedstate\":1},{\"filter\":\"mathjaxloader\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"emoticon\",\"localstate\":0,\"inheritedstate\":1},{\"filter\":\"urltolink\",\"localstate\":-1,\"inheritedstate\":1},{\"filter\":\"mediaplugin\",\"localstate\":-1,\"inheritedstate\":1}],\"courseformatoptions\":[{\"name\":\"hiddensections\",\"value\":2},{\"name\":\"hidetabsbar\",\"value\":0},{\"name\":\"coursedisplay\",\"value\":0},{\"name\":\"templatetopic\",\"value\":0},{\"name\":\"templatetopic_icons\",\"value\":0},{\"name\":\"tabsview\",\"value\":0},{\"name\":\"usessectionsnavigation\",\"value\":2},{\"name\":\"usescourseindex\",\"value\":0}]},{\"id\":301,\"fullname\":\"Trayecto final de evaluaci\\u00f3n\",\"displayname\":\"Trayecto final de evaluaci\\u00f3n\",\"shortname\":\"TFE-DUFCDPB\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/301304\\/course\\/generated\\/course.svg\",\"categoryid\":39,\"categoryname\":\"\",\"sortorder\":100001,\"summary\":\"\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[],\"showactivitydates\":true,\"showcompletionconditions\":null,\"contacts\":[],\"enrollmentmethods\":[\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"20 Horas\",\"value\":\"20 Horas\"}]},{\"id\":304,\"fullname\":\"Violencias Digitales: herramientas para la prevenci\\u00f3n\",\"displayname\":\"Violencias Digitales: herramientas para la prevenci\\u00f3n\",\"shortname\":\"Violencias Digitales\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/326578\\/course\\/generated\\/course.svg\",\"categoryid\":17,\"categoryname\":\"G\\u00e9nero y Derechos Humanos\",\"sortorder\":30001,\"summary\":\"<p><span><span class=\\\"citation-83\\\">El curso <\\/span><strong><span class=\\\"citation-83\\\">\\\"Violencias Digitales: herramientas para la prevenci\\u00f3n\\\"<\\/span><\\/strong><span class=\\\"citation-83\\\"> es una formaci\\u00f3n autogestiva de la <\\/span><strong><span class=\\\"citation-83\\\">Universidad Nacional de C\\u00f3rdoba<\\/span><\\/strong><\\/span><span class=\\\"citation-83 citation-end-83\\\"><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><\\/span><span>. <\\/span><span><span class=\\\"citation-82\\\">Se enmarca en el cumplimiento de la <\\/span><strong><span class=\\\"citation-82\\\">Ley Micaela<\\/span><\\/strong><span class=\\\"citation-82\\\"> (Ley N\\u00b0 27.499), pol\\u00edtica que desde 2024 integra obligatoriamente al claustro estudiantil para promover la formaci\\u00f3n en g\\u00e9nero y diversidad<\\/span><\\/span><span class=\\\"citation-82 citation-end-82\\\"><sup class=\\\"superscript\\\"><\\/sup><\\/span><span>.<\\/span><\\/p>\\r\\n<p><span><span class=\\\"citation-81\\\">El objetivo es brindar herramientas conceptuales y normativas para que las y los estudiantes logren posicionarse cr\\u00edticamente ante la violencia de g\\u00e9nero en entornos digitales<\\/span><span class=\\\"citation-81 citation-end-81\\\"><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><\\/span><span>. <\\/span><span><span class=\\\"citation-80\\\">El programa aborda desde la cultura patriarcal hasta problem\\u00e1ticas espec\\u00edficas como <\\/span><i><span class=\\\"citation-80\\\">grooming<\\/span><\\/i><span class=\\\"citation-80\\\">, <\\/span><i><span class=\\\"citation-80\\\">sexting<\\/span><\\/i><span class=\\\"citation-80\\\"> y <\\/span><i><span class=\\\"citation-80\\\">deepfakes<\\/span><\\/i><span class=\\\"citation-80\\\">, bajo el marco de la <\\/span><strong><span class=\\\"citation-80\\\">Ley Olimpia<\\/span><\\/strong><\\/span><span class=\\\"citation-80 citation-end-80\\\"><sup class=\\\"superscript\\\"><\\/sup><\\/span><span>.<\\/span><\\/span><\\/p>\\r\\n<p><span><span><span class=\\\"citation-79\\\">La metodolog\\u00eda se basa en la acci\\u00f3n: cada estudiante analiza situaciones audiovisuales de la vida universitaria, toma decisiones y accede a recursos din\\u00e1micos como podcasts e infograf\\u00edas<\\/span><span class=\\\"citation-79 citation-end-79\\\"><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><\\/span><span>. <\\/span><span class=\\\"citation-78\\\">La acreditaci\\u00f3n requiere completar los cuestionarios de cada m\\u00f3dulo para obtener el certificado correspondiente<\\/span><span class=\\\"citation-78 citation-end-78\\\"><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><sup class=\\\"superscript\\\"><\\/sup><\\/span><span>.<\\/span><\\/span><\\/span><\\/p>\",\"summaryformat\":1,\"summaryfiles\":[],\"overviewfiles\":[],\"showactivitydates\":true,\"showcompletionconditions\":true,\"contacts\":[],\"enrollmentmethods\":[\"self\",\"manual\"],\"customfields\":[{\"name\":\"Duraci\\u00f3n del curso\",\"shortname\":\"duracion\",\"type\":\"text\",\"valueraw\":\"30 Horas\",\"value\":\"30 Horas\"}]},{\"id\":308,\"fullname\":\"Copia - Organizaci\\u00f3n de eventos\",\"displayname\":\"Copia - Organizaci\\u00f3n de eventos\",\"shortname\":\"Organizaci\\u00f3n de eventos\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/341386\\/course\\/overviewfiles\\/Organizacion-de-Eventos-Profesional-planifica-y-gestiona-desde-cero--700x350.png\",\"categoryid\":27,\"categoryname\":\"Arte y Cultura\",\"sortorder\":10001,\"summary\":\"<p><span lang=\\\"es-ar\\\" xml:lang=\\\"es-ar\\\">\\u00bfAlguna vez sentiste que organizar un evento es un caos de imprevistos? <\\/span><span><span>Es hora de dejar la improvisaci\\u00f3n atr\\u00e1s y convertirte en un <strong>estratega de experiencias<\\/strong><\\/span><strong> <\\/strong><\\/span><\\/p>\\n<p><strong><span lang=\\\"es-ar\\\" xml:lang=\\\"es-ar\\\">\\u00bfQu\\u00e9 vas a lograr?<\\/span><\\/strong><span lang=\\\"es-ar\\\" xml:lang=\\\"es-ar\\\"> <\\/span><span><span>A trav\\u00e9s de nuestro m\\u00e9todo de <strong>andamiaje<\\/strong> a<\\/span>prender\\u00e1s a dominar las tres columnas del \\u00e9xito:<\\/span><\\/p>\\n<ul>\\n<li><strong><span lang=\\\"es-ar\\\" xml:lang=\\\"es-ar\\\"><span>Planificaci\\u00f3n Profesional:<\\/span><\\/span><\\/strong><span la