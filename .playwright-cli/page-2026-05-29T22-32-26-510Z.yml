- generic [ref=e2]: "[{\"id\":159,\"shortname\":\"inteligencia-artificial\",\"fullname\":\"Inteligencia Artificial: Empezar a Pensar(la)\",\"displayname\":\"Inteligencia Artificial: Empezar a Pensar(la)\",\"enrolledusercount\":15235,\"idnumber\":\"022\",\"visible\":1,\"summary\":\"\",\"summaryformat\":1,\"format\":\"onetopic\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/43943\\/course\\/overviewfiles\\/IA%20Empezar%20a%20pensar.png\",\"showgrades\":true,\"lang\":\"\",\"enablecompletion\":true,\"completionhascriteria\":false,\"completionusertracked\":true,\"category\":42,\"progress\":0,\"completed\":false,\"startdate\":1708657200,\"enddate\":0,\"marker\":0,\"lastaccess\":1770758103,\"isfavourite\":false,\"hidden\":false,\"overviewfiles\":[{\"filename\":\"IA Empezar a pensar.png\",\"filepath\":\"\\/\",\"filesize\":663242,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/43943\\/course\\/overviewfiles\\/IA%20Empezar%20a%20pensar.png\",\"timemodified\":1709303537,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"timemodified\":1765895017},{\"id\":276,\"shortname\":\"python-2\",\"fullname\":\"Aprendiendo a caminar en Python - Certificaci\\u00f3n 2\",\"displayname\":\"Aprendiendo a caminar en Python - Certificaci\\u00f3n 2\",\"enrolledusercount\":5320,\"idnumber\":\"106\",\"visible\":1,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><strong><\\/strong><\\/p><p dir=\\\"ltr\\\">\\u00a1Dale un impulso definitivo a tu carrera profesional!<\\/p><p dir=\\\"ltr\\\">\\u00bfYa conoces la sintaxis b\\u00e1sica? Es hora de dejar de escribir c\\u00f3digo suelto y empezar a construir soluciones reales. La Certificaci\\u00f3n 2: Aprendiendo a caminar en Python es tu entrada directa al mundo del An\\u00e1lisis de Datos, una de las habilidades m\\u00e1s demandadas del mercado.<\\/p><p dir=\\\"ltr\\\">No solo aprender\\u00e1s a programar; entrenar\\u00e1s tu mente para pensar con l\\u00f3gica avanzada. Dominar\\u00e1s el \\\"stack\\\" tecnol\\u00f3gico que usan los expertos: NumPy para procesar grandes vol\\u00famenes de informaci\\u00f3n y Matplotlib para convertir n\\u00fameros fr\\u00edos en visualizaciones de alto impacto.<\\/p><p dir=\\\"ltr\\\">Con una modalidad 100% flexible y enfocada en la pr\\u00e1ctica, cerrar\\u00e1s el curso con un Proyecto Integrador listo para mostrar en tu portafolio.<\\/p><p dir=\\\"ltr\\\">Deja de aprender teor\\u00eda y empieza a transformar datos en decisiones. \\u00a1Inscr\\u00edbete ahora y lleva tu perfil al siguiente nivel!<\\/p><p><\\/p>\",\"summaryformat\":1,\"format\":\"onetopic\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/224803\\/course\\/overviewfiles\\/Aprendiendo-a-caminar-en-Python-Certificacion-2-700x350.png\",\"showgrades\":false,\"lang\":\"\",\"enablecompletion\":true,\"completionhascriteria\":false,\"completionusertracked\":true,\"category\":42,\"progress\":0,\"completed\":false,\"startdate\":1766545200,\"enddate\":0,\"marker\":0,\"lastaccess\":1770758074,\"isfavourite\":false,\"hidden\":false,\"overviewfiles\":[{\"filename\":\"Aprendiendo-a-caminar-en-Python-Certificacion-2-700x350.png\",\"filepath\":\"\\/\",\"filesize\":294876,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/224803\\/course\\/overviewfiles\\/Aprendiendo-a-caminar-en-Python-Certificacion-2-700x350.png\",\"timemodified\":1767463081,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"timemodified\":1767463081},{\"id\":269,\"shortname\":\"python-1\",\"fullname\":\"Aprendiendo a caminar en Python - Certificaci\\u00f3n 1\",\"displayname\":\"Aprendiendo a caminar en Python - Certificaci\\u00f3n 1\",\"enrolledusercount\":12792,\"idnumber\":\"105\",\"visible\":1,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><strong><\\/strong><\\/p><p dir=\\\"ltr\\\">\\u00a1Potenci\\u00e1 tu perfil profesional con la Certificaci\\u00f3n 1 de \\\"Aprendiendo a caminar en Python\\\"!<\\/p><p dir=\\\"ltr\\\">Este curso autogestivo es la puerta de entrada ideal para quienes no tienen experiencia previa y buscan transformar su relaci\\u00f3n con la tecnolog\\u00eda, pasando de ser usuarios pasivos a productores activos. A trav\\u00e9s de cinco m\\u00f3dulos din\\u00e1micos, dominar\\u00e1s los fundamentos esenciales: desde la instalaci\\u00f3n de tu entorno de trabajo en Jupyter Notebook hasta la creaci\\u00f3n de algoritmos utilizando funciones, l\\u00f3gica booleana y estructuras de datos como diccionarios y listas.<\\/p><p dir=\\\"ltr\\\">Lo que realmente distingue a esta certificaci\\u00f3n es su enfoque pr\\u00e1ctico. Como broche de oro, acceder\\u00e1s a exclusivos \\\"Bonus Tracks\\\" donde aplicar\\u00e1s lo aprendido en proyectos reales:<\\/p><p dir=\\\"ltr\\\">\\u2022 Automatizaci\\u00f3n: Extra\\u00e9 texto de archivos PDF de forma masiva.<\\/p><p dir=\\\"ltr\\\">\\u2022 Alcance Global: Cre\\u00e1 un traductor autom\\u00e1tico que soporta m\\u00faltiples idiomas, incluido el guaran\\u00ed.<\\/p><p dir=\\\"ltr\\\">\\u2022 Innovaci\\u00f3n: Desarroll\\u00e1 una \\\"inteligencia artificial de juguete\\\" capaz de generar textos coherentes mediante modelos probabil\\u00edsticos.<\\/p><p dir=\\\"ltr\\\">No se trata solo de escribir c\\u00f3digo, sino de desarrollar un pensamiento computacional que te permita resolver problemas cotidianos con soluciones digitales avanzadas. \\u00a1Es el momento de dejar de observar la tecnolog\\u00eda y empezar a crearla!<\\/p><p><\\/p>\",\"summaryformat\":1,\"format\":\"onetopic\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/220855\\/course\\/overviewfiles\\/Aprendiendo-a-caminar-en-Python-Certificacion-1-700x350.png\",\"showgrades\":false,\"lang\":\"\",\"enablecompletion\":true,\"completionhascriteria\":false,\"completionusertracked\":true,\"category\":42,\"progress\":57.14285714285714,\"completed\":false,\"startdate\":1764126000,\"enddate\":0,\"marker\":0,\"lastaccess\":1778539544,\"isfavourite\":false,\"hidden\":false,\"overviewfiles\":[{\"filename\":\"Aprendiendo-a-caminar-en-Python-Certificacion-1-700x350.png\",\"filepath\":\"\\/\",\"filesize\":314937,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/220855\\/course\\/overviewfiles\\/Aprendiendo-a-caminar-en-Python-Certificacion-1-700x350.png\",\"timemodified\":1767463055,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"timemodified\":1767463055},{\"id\":267,\"shortname\":\"IA y automatizaci\\u00f3n \",\"fullname\":\"IA y automatizaci\\u00f3n de flujos de trabajo: aprende a automatizar de forma eficaz y eficiente\",\"displayname\":\"IA y automatizaci\\u00f3n de flujos de trabajo: aprende a automatizar de forma eficaz y eficiente\",\"enrolledusercount\":14319,\"idnumber\":\"\",\"visible\":1,\"summary\":\"<p dir=\\\"ltr\\\" style=\\\"text-align:left;\\\"><\\/p><p>Este curso autogestivo te propone dar un paso concreto hacia el <strong>mundo de la automatizaci\\u00f3n y la inteligencia artificial aplicada<\\/strong>, incorporando herramientas clave que hoy demandan las organizaciones. A lo largo del recorrido aprender\\u00e1s a <strong>dise\\u00f1ar y ejecutar flujos de trabajo automatizados<\\/strong> utilizando herramientas No-Code y Low-Code, con foco en N8N, sin necesidad de programaci\\u00f3n avanzada.<\\/p>\\r\\n<p>Desde los conceptos fundamentales de automatizaci\\u00f3n, workflows e IA, hasta la integraci\\u00f3n real de aplicaciones y servicios, el curso avanza de forma progresiva y pr\\u00e1ctica. Trabajar\\u00e1s sobre un <strong>caso contextualizado en una empresa<\\/strong>, resolviendo problem\\u00e1ticas reales mediante desaf\\u00edos, actividades guiadas y retroalimentaci\\u00f3n autom\\u00e1tica.<\\/p>\\r\\n<p>El objetivo final es claro: que construyas un <strong>workflow funcional<\\/strong>, documentado en un <strong>portafolio personal<\\/strong>, que demuestre tus competencias t\\u00e9cnicas y tu capacidad para aplicar automatizaci\\u00f3n e IA en contextos laborales reales. Una propuesta ideal para potenciar tu perfil IT y dar valor concreto a tus conocimientos.<\\/p><p><\\/p>\",\"summaryformat\":1,\"format\":\"onetopic\",\"courseimage\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/pluginfile.php\\/220058\\/course\\/overviewfiles\\/IA-y-automatizacion-de-flujo-de-trabajo-aprende-a-automatizar-de-forma-eficiente-y-eficaz--700x350.png\",\"showgrades\":true,\"lang\":\"\",\"enablecompletion\":true,\"completionhascriteria\":false,\"completionusertracked\":true,\"category\":42,\"progress\":94.73684210526315,\"completed\":false,\"startdate\":1763521200,\"enddate\":0,\"marker\":0,\"lastaccess\":1773108794,\"isfavourite\":false,\"hidden\":false,\"overviewfiles\":[{\"filename\":\"IA-y-automatizacion-de-flujo-de-trabajo-aprende-a-automatizar-de-forma-eficiente-y-eficaz--700x350.png\",\"filepath\":\"\\/\",\"filesize\":276064,\"fileurl\":\"https:\\/\\/campus.aulavirtual.unc.edu.ar\\/webservice\\/pluginfile.php\\/220058\\/course\\/overviewfiles\\/IA-y-automatizacion-de-flujo-de-trabajo-aprende-a-automatizar-de-forma-eficiente-y-eficaz--700x350.png\",\"timemodified\":1767463341,\"mimetype\":\"image\\/png\"}],\"showactivitydates\":true,\"showcompletionconditions\":true,\"timemodified\":1767463341}]"